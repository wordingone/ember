# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: "OPS: issue disposition baseline"

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

# Finite campaign: github-work-system-v1 issue baseline.
# Owner: Ember repository maintainer.
# Completion: one content-addressed full snapshot and reviewed classification plan.
# Retirement: remove after the migration receipt is merged and post-state is verified.
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Capture full issue evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B src/ember/governance/scripts/github/snapshot.py --output issue-disposition-baseline.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-disposition-baseline-${{ github.run_id }}
          path: issue-disposition-baseline.json
          retention-days: 90
