# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: issue1947 protected eval release recomputation

on:
  workflow_dispatch:
    inputs:
      designation_receipt_raw_sha256:
        description: Full SHA-256 of the designated checkpoint manifest
        required: true
        type: string
      matrix_self_sha256:
        description: Full protected-matrix self SHA-256
        required: true
        type: string
      analysis_self_sha256:
        description: Full prospective-analysis self SHA-256
        required: true
        type: string
      bundle_path:
        description: Repository-relative redacted release-bundle.json path
        required: true
        type: string

permissions:
  contents: read

jobs:
  full-matrix-recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Independent raw-row recomputation
        run: >-
          python src/ember/governance/scripts/issue1947_release_recompute.py
          --bundle "${{ inputs.bundle_path }}"
          --expected-designation-manifest-sha256 "${{ inputs.designation_receipt_raw_sha256 }}"
          --expected-matrix-self-sha256 "${{ inputs.matrix_self_sha256 }}"
          --expected-analysis-self-sha256 "${{ inputs.analysis_self_sha256 }}"
          --receipt "issue1947-release-recompute-${{ github.run_id }}.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue1947-release-recompute
          path: issue1947-release-recompute-*.json
          if-no-files-found: error
          retention-days: 90

  windows-loader-shape:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python src/ember/governance/scripts/issue1947_release_recompute.py --help
