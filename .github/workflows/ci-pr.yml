# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: ci-pr

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled, milestoned, demilestoned]
  merge_group:

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.sha }}
  # Cancel only when a new head supersedes this run. Metadata activity (body
  # edit, label, milestone) changes inputs live_pr_policy reads, so those runs
  # must reach a real conclusion instead of being cancelled before any job
  # exists -- a zero-run suite is what branch protection strands on (#1375).
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest==8.4.1" "PyYAML==6.0.2" "jsonschema==4.26.0" "cryptography==49.0.0"
      - name: Compile changed governance tooling
        run: python -B -m compileall -q scripts/github
      - name: Bootstrap exact-head live PR policy (read-only)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${RUNNER_TEMP}/pr.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            > "${RUNNER_TEMP}/pr-files.json"
          gh api graphql \
            -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){closingIssuesReferences(first:50){nodes{number}}}}}' \
            -F owner="${GITHUB_REPOSITORY%%/*}" -F repo="${GITHUB_REPOSITORY#*/}" -F number="${PR_NUMBER}" \
            --jq '[.data.repository.pullRequest.closingIssuesReferences.nodes[].number]' \
            > "${RUNNER_TEMP}/pr-closing-issues.json"
          python -m scripts.github.live_pr_policy \
            --root . \
            --subject-root . \
            --pr-json "${RUNNER_TEMP}/pr.json" \
            --files-json "${RUNNER_TEMP}/pr-files.json" \
            --closing-issues-json "${RUNNER_TEMP}/pr-closing-issues.json" \
            --event-base-sha "${BASE_SHA}" \
            --event-head-sha "${HEAD_SHA}" \
            --snapshot-output "${RUNNER_TEMP}/pr-policy-snapshot.json"
      - name: Run deterministic policy tests
        run: python -B -m unittest discover -s scripts/github -p "test_*.py" -v
      - name: Enforce Cond-4 battery surface transition
        if: github.event_name == 'pull_request'
        env:
          EMBER_COND4_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python -B -m pytest -q \
            scripts/tests/test_issue1396_cond4_surface.py \
            scripts/tests/test_verify_ember01_completion.py -k "cond4"
      - name: Verify text-lab input identity pins are fresh
        run: python -B tools/ember-restart-3b/remint_text_lab_input_identity.py --check
      - name: Run text-lab identity freshness regressions
        run: python -B -m unittest discover -s tests/ember_restart_model -p "test_remint_text_lab_input_identity.py" -v
      - name: Verify POSIX owned process-tree cleanup
        run: python -B scripts/ember_gate_process_supervision_selftest.py
  owned-process-posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest==8.4.1"
      - name: Prove controller-death cleanup on ${{ matrix.os }}
        run: python -B scripts/owned_process.py --timeout-seconds 120 -- python -B -m pytest -q scripts/tests/test_owned_process.py
  rust:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: runtime/ember-lab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Lint Rust with clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # Compile the complete suite, then run the host-independent gate. Four
      # governed-dispatch tests require a fixed positive Windows pagefile
      # maximum; GitHub-hosted Windows uses system-managed pagefiles, which the
      # production daemon correctly refuses. Those tests remain covered by the
      # exact local fixed-pagefile replay recorded in the PR.
      - name: Compile complete Rust test suite
        run: cargo test --locked --no-run
      # This block runs under pwsh (the windows-latest default), which
      # propagates only the LAST command's exit code. A native command that
      # fails mid-block does not stop the block and does not fail the job, so
      # every cargo invocation needs its OWN exit check -- a single trailing
      # guard only ever gated the one line directly above it, leaving --lib,
      # control_plane and dispatch_manifest able to fail internally while the
      # job still reported success.
      #
      # control_plane carries --show-output because two of its tests skip
      # themselves on hosted windows-latest (system-managed pagefile, see
      # #1771) by printing a reason and returning early. That makes them
      # *pass*, and libtest discards a passing test's output, so without this
      # flag the log shows only "68 passed" and a reader cannot tell the two
      # ran from the two skipped. --show-output rather than --nocapture: it
      # keeps capture on, so each reason line stays attributed to its test
      # instead of interleaving across parallel threads. Measured cost is 32
      # lines (115 -> 147 locally).
      - name: Run host-independent Rust gate
        run: |
          cargo test --locked --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --test control_plane -- --show-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --test dispatch_manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --test artifact_custody
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --test rpc_named_pipe named_pipe_rpc_survives_daemon_restart_and_controls_bound_job -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  rust-linux-compile:
    # Compile every ember-lab Rust target on Linux before merge. The Windows
    # Rust job cannot detect a Linux test calling a helper hidden by
    # cfg(windows), while ci-main discovers that class only after merge.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime/ember-lab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile complete Rust test suite on Linux
        run: cargo test --locked --no-run
  production-rung-replay:
    # Class-kill for #1302: a generator/tokenizer/config edit that lands
    # without re-minting the checked-in rung must fail HERE, on the PR --
    # not at the next certified /train launch. Runs the same canonical
    # replay the training input-admission path executes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install "tokenizers==0.22.2"
      - name: Replay checked-in production rung from canonical owned sources
        run: python -B tools/ember-restart-3b/production_rung.py --repo-root .
  cli:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tools/ember-cli/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      # The repository currently carries unrelated full-suite/typecheck debt.
      # Keep the merge gate executable and deterministic instead of making
      # every PR inherit that historical failure surface.
      - run: bun run test -- build-tools/lifecycle-smoke.test.ts
      # The launcher compiles the cockpit straight into its external state root by
      # setting EMBER_BUILD_OUTFILE (#1330). Nothing in CI exercised that override, so
      # a regression in it only surfaced on a real launch. This runs BEFORE the default
      # build so a leftover ember.exe cannot make the assertions vacuous.
      - name: Build into an external staging name (EMBER_BUILD_OUTFILE)
        env:
          EMBER_BUILD_OUTFILE: ${{ runner.temp }}\ember-staged.exe
        run: |
          if (Test-Path ember.exe) { throw "ember.exe already exists; the staging-name assertions would be vacuous" }
          bun run build
          if ($LASTEXITCODE -ne 0) { throw "EMBER_BUILD_OUTFILE build failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $env:EMBER_BUILD_OUTFILE)) { throw "build did not write $env:EMBER_BUILD_OUTFILE" }
          if (Test-Path ember.exe) { throw "EMBER_BUILD_OUTFILE was ignored: the build wrote the default ember.exe" }
      - run: bun run build
  launcher:
    # scripts/launch-ember-cli.ps1 has exactly one end-to-end guard, and until #1390 it
    # ran in ci-nightly only: a branch that broke it merged on a green PR and halted the
    # next nightly instead. Running it here fails the merge that causes the regression.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run root launcher suite
        run: python -B -m unittest discover -s tests -p "test_ember_root_launcher.py" -v
      - name: Verify versioned desktop deployment and shortcuts
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/ember-desktop-deployment-selftest.ps1
      - name: Verify Windows Job Object process-tree cleanup
        run: python -B scripts/ember_gate_process_supervision_selftest.py
  ci-pr:
    if: always()
    needs: [python, owned-process-posix, rust, rust-linux-compile, cli, launcher, production-rung-replay]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stable aggregate verdict
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          results = {k: v["result"] for k, v in json.loads(os.environ["NEEDS_JSON"]).items()}
          print(json.dumps(results, sort_keys=True))
          sys.exit(0 if all(v in {"success", "skipped"} for v in results.values()) else 1)
          PY
