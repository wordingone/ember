# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: Issue lifecycle sweep

on:
  schedule:
    - cron: "11 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  advisory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Capture and classify lifecycle state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/github/snapshot.py --without-comments --output repository-snapshot.json
          python -B scripts/github/repo_health.py --snapshot repository-snapshot.json --output issue-lifecycle.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-lifecycle-${{ github.run_id }}
          path: issue-lifecycle.json
          retention-days: 30
