name: changelog
# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember

# Keeps CHANGELOG.md derived, not hand-maintained. Two jobs:
#   - `regenerate` (push to master): runs scripts/gen_changelog.py and commits
#     back ONLY when the generated bytes actually changed, so a normal push
#     that changes nothing changelog-relevant produces no commit and the
#     bot's own commit carries [skip-changelog] so it does not retrigger a
#     second meaningful run of itself.
#   - `drift-check` (pull_request into master): regenerates FROM the PR's
#     merge-base with master (never from the PR branch's own tip, and never
#     from master's current moving HEAD) and diffs the result against the
#     CHANGELOG.md tracked on the PR branch, read-only -- the half that keeps
#     the file honest between pushes. Two things NOT to check against, both
#     deliberate: HEAD, because an ordinary PR carries its own commits on its
#     own branch not yet reflected in CHANGELOG.md (that lands only once
#     `regenerate` runs on the merge push); and origin/master's current tip,
#     because master keeps moving after a PR branches and a PR is not
#     expected to rebase just to keep a generated file current -- either
#     would fail on nearly every ordinary PR for a reason that isn't actually
#     drift. The merge-base is the one fixed point both branches agree on.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege at the JOB level rather than the workflow level: a workflow-wide
# contents:write would hand the read-only drift-check job a token that can push to
# master, which it has no use for. Each job declares exactly what it needs.
permissions: {}

jobs:
  regenerate:
    permissions:
      contents: write
    if: >-
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, '[skip-changelog]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full first-parent history is the generator's input

      - name: Regenerate CHANGELOG.md
        run: python scripts/gen_changelog.py

      - name: Commit and push only if CHANGELOG.md changed
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "wordingone"
          git config user.email "hjhan811@gmail.com"
          git add CHANGELOG.md
          git commit -m "chore: regenerate CHANGELOG.md [skip-changelog]" \
            -m "Generated by scripts/gen_changelog.py from git log --first-parent." \
            -m "goal_id: EMBER-02" \
            -m "workstream_id: EMBER-02A" \
            -m "next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember"
          git push origin HEAD:master

  drift-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.md is up to date (read-only)
        run: |
          set -euo pipefail
          git fetch origin master
          base="$(git merge-base HEAD origin/master)"
          python scripts/gen_changelog.py --ref "$base" --check
