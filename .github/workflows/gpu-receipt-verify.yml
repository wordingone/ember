# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: gpu-receipt-verify

on:
  pull_request:
    branches: [master]
    paths:
      - "receipts/**"
      - "scripts/**"
      - "tools/ember-restart-3b/**"
      - ".github/workflows/gpu-receipt-verify.yml"
  push:
    branches: [master]
    paths:
      - "receipts/**"
      - "scripts/**"
      - "tools/ember-restart-3b/**"
      - ".github/workflows/gpu-receipt-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify checked-in receipt structures only
        run: |
          python -B -m compileall -q tools/ember-restart-3b scripts
          echo "This CPU job verifies receipt structure and bindings; it does not claim GPU execution."
