# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: oldest-issue-disposition-capture

on:
  workflow_dispatch:
    inputs:
      after_created_at:
        description: RFC3339 created_at of the last issue in the prior chunk
        required: false
        default: ""
        type: string
      after_issue_number:
        description: Issue number paired with after_created_at; 0 starts at oldest
        required: false
        default: "0"
        type: string

permissions:
  contents: read
  issues: read

concurrency:
  group: oldest-issue-disposition-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require an exact master dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/master"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Capture immutable non-authorizing raw sources
        env:
          GH_TOKEN: ${{ github.token }}
          AFTER_CREATED_AT: ${{ inputs.after_created_at }}
          AFTER_ISSUE_NUMBER: ${{ inputs.after_issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/oldest-issue-disposition-raw"
          out="${RUNNER_TEMP}/oldest-issue-disposition-raw-artifact"
          mkdir -p "${raw}" "${out}"
          captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [[ -z "${AFTER_CREATED_AT}" && "${AFTER_ISSUE_NUMBER}" = "0" ]]; then
            :
          elif [[ "${AFTER_CREATED_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?Z$ ]] \
            && [[ "${AFTER_ISSUE_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            :
          else
            echo "cursor fields must be initial (empty/0) or a valid RFC3339/positive pair" >&2
            exit 1
          fi

          api_master=$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq .sha)
          test "${api_master}" = "${GITHUB_SHA}"

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100&sort=created&direction=asc" \
            > "${raw}/issues_pre.json"
          mapfile -t issue_numbers < <(
            jq -r \
              --arg after_created_at "${AFTER_CREATED_AT}" \
              --argjson after_issue_number "${AFTER_ISSUE_NUMBER}" '
              [.[][] | select(has("pull_request") | not)]
              | sort_by(.created_at, .number)
              | map(select(
                  ($after_issue_number == 0)
                  or (.created_at > $after_created_at)
                  or (
                    .created_at == $after_created_at
                    and .number > $after_issue_number
                  )
                ))
              | .[:20]
              | .[].number
            ' "${raw}/issues_pre.json"
          )
          test "${#issue_numbers[@]}" -ge 1
          test "${#issue_numbers[@]}" -le 20
          for number in "${issue_numbers[@]}"; do
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/issues/${number}/comments?per_page=100" \
              > "${raw}/comments-${number}-pre.json"
          done

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100&sort=created&direction=asc" \
            > "${raw}/issues_post.json"
          for number in "${issue_numbers[@]}"; do
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/issues/${number}/comments?per_page=100" \
              > "${raw}/comments-${number}-post.json"
          done

          final_master=$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq .sha)
          test "${final_master}" = "${GITHUB_SHA}"

          bundle="${out}/ember-oldest-issue-disposition-015-raw-sources-v1.json"
          python -B scripts/build_oldest_issue_raw_bundle.py \
            --raw-root "${raw}" --output "${bundle}"
          cursor_args=()
          if [[ "${AFTER_ISSUE_NUMBER}" != "0" ]]; then
            cursor_args+=(
              --after-created-at "${AFTER_CREATED_AT}"
              --after-issue-number "${AFTER_ISSUE_NUMBER}"
            )
          fi
          python -B scripts/oldest_issue_disposition.py capture \
            --raw-root "${raw}" \
            --master-sha "${GITHUB_SHA}" \
            --captured-at "${captured_at}" \
            "${cursor_args[@]}" \
            --output "${out}/capture.json"
          cp "${raw}"/*.json "${out}/"
          (
            cd "${out}"
            sha256sum ./*.json | sort -k2 > SHA256SUMS
          )

      - name: Upload immutable raw capture
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oldest-issue-raw-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/oldest-issue-disposition-raw-artifact
          if-no-files-found: error
          retention-days: 90

      - name: Build and verify semantic disposition packet
        shell: bash
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/oldest-issue-disposition-raw-artifact"
          out="${RUNNER_TEMP}/oldest-issue-disposition-verified-artifact"
          mkdir -p "${out}"
          python -B scripts/build_oldest_issue_decisions.py \
            --capture "${raw}/capture.json" \
            --classifications manifests/oldest-issue-disposition/classifications-v1.json \
            --output "${out}/decisions.json"
          python -B scripts/oldest_issue_disposition.py build \
            --capture "${raw}/capture.json" \
            --decisions "${out}/decisions.json" \
            --output "${out}/packet.json"
          python -B scripts/oldest_issue_disposition.py verify \
            --packet "${out}/packet.json" \
            --expected-master-sha "${GITHUB_SHA}"
          python -B scripts/verify_oldest_issue_disposition_packet.py \
            --packet "${out}/packet.json" \
            --raw-bundle "${raw}/ember-oldest-issue-disposition-015-raw-sources-v1.json" \
            --classifications manifests/oldest-issue-disposition/classifications-v1.json \
            --expected-master-sha "${GITHUB_SHA}"
          cp "${raw}/capture.json" "${out}/capture.json"
          (
            cd "${out}"
            sha256sum ./*.json | sort -k2 > SHA256SUMS
          )

      - name: Upload verified non-authorizing packet
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oldest-issue-disposition-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/oldest-issue-disposition-verified-artifact
          if-no-files-found: error
          retention-days: 90