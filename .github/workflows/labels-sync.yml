# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: Labels policy sync

on:
  push:
    branches: [master]
    paths:
      - .github/labels.yml
      - .github/label-migrations.yml
      - src/ember/governance/scripts/github/labels.py
      - src/ember/governance/scripts/github/labels_engine.py
      - .github/workflows/labels-sync.yml
      - src/ember/governance/scripts/github/workflow_policy.py
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the exact freshly generated label plan
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: labels-sync
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted repository bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: wordingone/ember
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install schema dependency
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2
      - name: Capture exact trusted source
        run: git rev-parse HEAD > trusted-master-sha.txt
      - name: Capture exact live label state
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B -m src.ember.governance.scripts.github.labels audit
          --manifest .github/labels.yml
          --migrations .github/label-migrations.yml
          --output label-audit.json
      - name: Generate deterministic plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B -m src.ember.governance.scripts.github.labels plan
          --snapshot label-audit.json
          --manifest .github/labels.yml
          --migrations .github/label-migrations.yml
          --output label-plan.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: labels-policy-validation-${{ github.run_id }}
          path: |
            trusted-master-sha.txt
            label-audit.json
            label-plan.json
          if-no-files-found: error
          retention-days: 30

  apply:
    needs: validate
    if: >-
      github.repository == 'wordingone/ember' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' &&
      github.ref_protected == true &&
      inputs.apply
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact trusted master bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: wordingone/ember
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install schema dependency
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2
      - name: Capture exact trusted source
        run: git rev-parse HEAD > trusted-master-sha.txt
      - name: Capture exact live label state
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B -m src.ember.governance.scripts.github.labels audit
          --manifest .github/labels.yml
          --migrations .github/label-migrations.yml
          --output label-audit.json
      - name: Generate deterministic plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B -m src.ember.governance.scripts.github.labels plan
          --snapshot label-audit.json
          --manifest .github/labels.yml
          --migrations .github/label-migrations.yml
          --output label-plan.json
      - name: Apply exact plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B -m src.ember.governance.scripts.github.labels apply
          --plan label-plan.json
          --manifest .github/labels.yml
          --migrations .github/label-migrations.yml
          --output label-apply-receipt.json
          --confirm-apply
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: labels-policy-apply-${{ github.run_id }}
          path: |
            trusted-master-sha.txt
            label-audit.json
            label-plan.json
            label-apply-receipt.json
          if-no-files-found: error
          retention-days: 30
