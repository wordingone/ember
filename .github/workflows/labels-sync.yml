# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: Labels policy sync

on:
  pull_request:
    paths:
      - .github/labels.yml
      - .github/label-migrations.yml
      - scripts/github/labels.py
      - scripts/github/labels_engine.py
  push:
    branches: [master]
    paths:
      - .github/labels.yml
      - .github/label-migrations.yml
      - scripts/github/labels.py
      - scripts/github/labels_engine.py
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the exact freshly generated label plan
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: labels-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install schema dependency
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2
      - name: Capture exact live label state
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B scripts/github/labels.py audit
          --manifest .github/labels.yml
          --migrations .github/label-migrations.yml
          --output label-audit.json
      - name: Generate deterministic plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B scripts/github/labels.py plan
          --snapshot label-audit.json
          --manifest .github/labels.yml
          --migrations .github/label-migrations.yml
          --output label-plan.json
      - name: Apply exact plan
        if: github.event_name == 'workflow_dispatch' && inputs.apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B scripts/github/labels.py apply
          --plan label-plan.json
          --manifest .github/labels.yml
          --migrations .github/label-migrations.yml
          --output label-apply-receipt.json
          --confirm-apply
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: labels-policy-${{ github.run_id }}
          path: |
            label-audit.json
            label-plan.json
            label-apply-receipt.json
          if-no-files-found: ignore
          retention-days: 30
