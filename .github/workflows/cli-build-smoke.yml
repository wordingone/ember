# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: cli-build-smoke

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "tools/ember-cli/src/**"
      - ".github/workflows/cli-build-smoke.yml"

permissions:
  contents: read

jobs:
  cli-build-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
        working-directory: tools/ember-cli/src
      - run: bun run build
        working-directory: tools/ember-cli/src
      - name: Smoke-test built binary invocation
        working-directory: tools/ember-cli/src
        run: .\ember.exe --help
