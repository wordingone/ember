# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: issue1949-a-clean-linux

on:
  workflow_dispatch:
    inputs:
      declared_head:
        description: Exact merged commit to prove
        required: true
        type: string
      leg_spec_base64:
        description: Base64 of the externally bound immutable Linux leg specification
        required: true
        type: string
      leg_spec_raw_sha256:
        description: Publicly bound raw SHA-256 of the decoded Linux leg specification
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-clean-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact declared tip into arbitrary root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.declared_head }}
          path: fresh clone é
          persist-credentials: false

      - name: Refuse checkout identity drift
        shell: bash
        env:
          DECLARED_HEAD: ${{ inputs.declared_head }}
        working-directory: fresh clone é
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$DECLARED_HEAD"
          test -z "$(git status --porcelain)"

      - name: Refuse a checkout whose canonical tool root is absent
        shell: bash
        env:
          CHECKOUT: ${{ github.workspace }}/fresh clone é
        run: |
          set -euo pipefail
          tool="$CHECKOUT/src/ember/infrastructure/tools/ember-restart-3b/python_environment.py"
          if [ ! -f "$tool" ]; then
            echo "A_CLEAN_TOOL_ROOT_UNRESOLVED: the declared head does not carry the canonical tool" >&2
            exit 1
          fi

      - name: Provision exact Linux platform profile
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12.3'
          cache: 'pip'

      - name: Pin Linux profile pip
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-deps 'pip==24.0'

      - name: Bootstrap exact declared environment and refused sdist bytes
        shell: bash
        env:
          CHECKOUT: ${{ github.workspace }}/fresh clone é
          INSTALL: ${{ runner.temp }}/issue1949-a-clean-linux-install.json
          SDIST: ${{ runner.temp }}/setuptools-84.0.0.tar.gz
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python3 -m pip download --disable-pip-version-check --no-deps --no-binary=:all: \
            --dest "$RUNNER_TEMP" setuptools==84.0.0
          printf '%s  %s\n' 'f4695c21257f0d9b537ec2692c941d02ee143b7cc1276941349a546573b2ef73' "$SDIST" \
            | sha256sum --check --strict -
          set +e
          python3 "$CHECKOUT/src/ember/infrastructure/tools/ember-restart-3b/python_environment.py" \
            --root "$CHECKOUT" --platform-profile linux install --receipt "$INSTALL"
          install_rc=$?
          set -e
          if [ "$install_rc" -ne 0 ]; then
            shopt -s nullglob
            for log in \
              "${INSTALL%.json}"-*.stdout.log \
              "${INSTALL%.json}"-*.stderr.log; do
              printf '\n===== %s =====\n' "$(basename "$log")"
              tail -n 200 "$log"
            done
            if [ -f "$INSTALL" ]; then
              printf '\n===== %s =====\n' "$(basename "$INSTALL")"
              cat "$INSTALL"
            fi
            exit "$install_rc"
          fi

      - name: Mint and publish exact Linux platform plan identity
        shell: bash
        env:
          CHECKOUT: ${{ github.workspace }}/fresh clone é
          DECLARED_HEAD: ${{ inputs.declared_head }}
          LEG_SPEC_BASE64: ${{ inputs.leg_spec_base64 }}
          LEG_SPEC_RAW_SHA256: ${{ inputs.leg_spec_raw_sha256 }}
          LEG_SPEC: ${{ runner.temp }}/issue1949-a-clean-linux-leg-spec.json
          PLAN: ${{ runner.temp }}/issue1949-a-clean-linux-plan.json
          INSTALL: ${{ runner.temp }}/issue1949-a-clean-linux-install.json
          SDIST: ${{ runner.temp }}/setuptools-84.0.0.tar.gz
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          printf '%s' "$LEG_SPEC_BASE64" | base64 --decode > "$LEG_SPEC"
          printf '%s  %s\n' "$LEG_SPEC_RAW_SHA256" "$LEG_SPEC" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/B:/tmp"
          "$CHECKOUT/state/python-environments/issue1949-a-clean-linux-install/bin/python" \
            "$CHECKOUT/scripts/issue1949_a_clean.py" mint-plan \
            --repo-root "$CHECKOUT" --leg-spec "$LEG_SPEC" --output "$PLAN" \
            --declared-head "$DECLARED_HEAD" --platform linux \
            --python-executable "$CHECKOUT/state/python-environments/issue1949-a-clean-linux-install/bin/python" \
            --cargo-executable "$(command -v cargo)" --artifact-root "$RUNNER_TEMP" \
            --install-receipt "$INSTALL" --setuptools-sdist "$SDIST"

      - name: Run published Linux CPU clean-clone plan outside checkout CWD
        shell: bash
        env:
          CHECKOUT: ${{ github.workspace }}/fresh clone é
          PLAN: ${{ runner.temp }}/issue1949-a-clean-linux-plan.json
          RECEIPT: ${{ runner.temp }}/issue1949-a-clean-linux.json
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          "$CHECKOUT/state/python-environments/issue1949-a-clean-linux-install/bin/python" \
            "$CHECKOUT/scripts/issue1949_a_clean.py" run \
            --repo-root "$CHECKOUT" \
            --plan "$PLAN" \
            --output "$RECEIPT" \
            --platform linux
          "$CHECKOUT/state/python-environments/issue1949-a-clean-linux-install/bin/python" \
            "$CHECKOUT/scripts/issue1949_a_clean.py" verify --receipt "$RECEIPT"

      - name: Upload raw receipt and per-leg streams
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: issue1949-a-clean-linux-${{ inputs.declared_head }}
          path: |
            ${{ runner.temp }}/issue1949-a-clean-linux.json
            ${{ runner.temp }}/issue1949-a-clean-linux-plan.json
            ${{ runner.temp }}/issue1949-a-clean-linux-leg-spec.json
            ${{ runner.temp }}/issue1949-a-clean-linux-install*
            ${{ runner.temp }}/issue1949-a-clean-linux.streams/**
          if-no-files-found: warn
