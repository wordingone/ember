name: freshness-monitor
# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember

# The "never stale" ring. Runs daily and FAILS (red run = alarm) when the repo
# drifts back toward the conditions this consolidation removed: a stale trunk,
# branch sprawl, or stranded issues/PRs. A failing scheduled run is the signal
# that an owner must act.

on:
  schedule:
    - cron: '17 13 * * *'   # daily, off the :00 mark
  workflow_dispatch: {}

env:
  MAX_TRUNK_AGE_DAYS: '4'    # master must move at least this often
  MAX_BRANCHES: '25'         # steady-state active-branch ceiling
  MAX_ITEM_AGE_DAYS: '10'    # an open issue/PR older than this with no update is stale

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FAIL=0

          require_count() {
            local name="$1"
            local value="$2"
            case "$value" in
              ''|*[!0-9]*)
                printf 'FAIL [tracker] invalid %s count from stale report\n' "$name" >&2
                exit 1
                ;;
            esac
          }

          require_stale_report() {
            local report="$1"
            if [ ! -s "$report" ]; then
              printf 'FAIL [tracker] stale report is missing or empty\n' >&2
              exit 1
            fi
            if ! jq -e '
              (.schema_version == "ember-lifecycle-stale-v1")
              and (.receipt_sha256 | type == "string" and test("^[0-9a-f]{64}$"))
              and (.master_sha | type == "string" and test("^[0-9a-f]{40}$"))
              and (.counts | type == "object")
              and (.counts.pull_requests | type == "number" and isfinite and . >= 0 and floor == .)
              and (.counts.issues | type == "number" and isfinite and . >= 0 and floor == .)
              and (.pull_requests | type == "array")
              and (.issues | type == "array")
            ' "$report" >/dev/null; then
              printf 'FAIL [tracker] invalid stale report schema/counts; refusing stale verdict\n' >&2
              exit 1
            fi
          }
          now=$(date +%s)

          # 1. trunk freshness
          last=$(git log -1 --format=%ct origin/master)
          age=$(( (now - last) / 86400 ))
          if [ "$age" -gt "${MAX_TRUNK_AGE_DAYS}" ]; then
            echo "FAIL [trunk] master last moved ${age}d ago (> ${MAX_TRUNK_AGE_DAYS}d) — work is not integrating to the canonical branch"
            FAIL=1
          else
            echo "ok   [trunk] master moved ${age}d ago"
          fi

          # 2. branch sprawl
          n=$(git branch -r | grep -vE 'HEAD' | wc -l | tr -d ' ')
          if [ "$n" -gt "${MAX_BRANCHES}" ]; then
            echo "FAIL [branches] ${n} remote branches (> ${MAX_BRANCHES}) — prune merged/dead branches"
            FAIL=1
          else
            echo "ok   [branches] ${n} remote branches"
          fi

          # 3. Complete, content-addressed open-population census. The census
          # collector follows every page and excludes PRs from issue counts;
          # an API/partial-page failure exits non-zero before any receipt lands.
          master_sha=$(git rev-parse origin/master)
          cutoff=$(date -u -d "-${MAX_ITEM_AGE_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          stale_report="${RUNNER_TEMP}/ember-lifecycle-stale.json"
          if ! python scripts/lifecycle_census.py \
              --repo "${GITHUB_REPOSITORY}" \
              --master-sha "${master_sha}" \
              --stale-before "${cutoff}" \
              --stale-output "${stale_report}" \
              --output receipts/lifecycle-census; then
            printf 'FAIL [tracker] complete census/report generation failed; refusing stale verdict\n' >&2
            exit 1
          fi

          # 4. stale open issues / PRs derived from the exact census populations
          require_stale_report "$stale_report"
          if ! jq -e '
            (.schema_version == "ember-lifecycle-stale-v1")
            and (.receipt_sha256 | type == "string" and test("^[0-9a-f]{64}$"))
            and (.master_sha | type == "string" and test("^[0-9a-f]{40}$"))
            and (.counts | type == "object")
            and (.counts.pull_requests | type == "number" and isfinite and . >= 0 and floor == .)
            and (.counts.issues | type == "number" and isfinite and . >= 0 and floor == .)
            and (.pull_requests | type == "array")
            and (.issues | type == "array")
          ' "${stale_report}" >/dev/null; then
            printf 'FAIL [tracker] invalid stale report schema/counts; refusing stale verdict\n' >&2
            exit 1
          fi
          stale_pr=$(jq -er 'if (.counts.pull_requests | type) == "number" and (.counts.pull_requests >= 0) and ((.counts.pull_requests | floor) == .counts.pull_requests) then (.counts.pull_requests | tostring) else error("invalid pull_requests count") end' "${stale_report}")
          stale_is=$(jq -er 'if (.counts.issues | type) == "number" and (.counts.issues >= 0) and ((.counts.issues | floor) == .counts.issues) then (.counts.issues | tostring) else error("invalid issues count") end' "${stale_report}")
          require_count "pull_requests" "$stale_pr"
          require_count "issues" "$stale_is"
          if [ "$stale_pr" -gt 0 ] || [ "$stale_is" -gt 0 ]; then
            echo "FAIL [tracker] ${stale_pr} stale PRs + ${stale_is} stale issues (no update in ${MAX_ITEM_AGE_DAYS}d)"
            jq -r '.pull_requests[] | "  PR #\(.number) \(.updated_at[:10]) \(.title)"' "${stale_report}"
            jq -r '.issues[] | "  issue #\(.number) \(.updated_at[:10]) \(.title)"' "${stale_report}"
            FAIL=1
          else
            echo "ok   [tracker] no stale open issues/PRs"
          fi

          echo
          if [ "$FAIL" -eq 0 ]; then echo "freshness-monitor: PASS"; else echo "freshness-monitor: FAIL"; exit 1; fi
