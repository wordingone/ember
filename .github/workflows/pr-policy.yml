# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: pr-policy

on:
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, milestoned, demilestoned, ready_for_review]
  merge_group:

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install closed parser dependency
        run: python -m pip install "PyYAML==6.0.2"
      - name: Validate repository policy sources
        run: |
          python -B scripts/github/policy.py labels --manifest .github/labels.yml
          python -B scripts/github/policy.py migrations --manifest .github/labels.yml --migrations .github/label-migrations.yml
          python -B scripts/github/template_policy.py --root .
          python -B scripts/github/workflow_policy.py --root .
      - name: Run policy unit tests
        run: python -B -m unittest discover -s scripts/github -p "test_*.py" -v
