# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: Issue intake policy

on:
  issues:
    types: [opened, edited, labeled, unlabeled, milestoned, demilestoned, reopened]

permissions:
  contents: read
  issues: read

jobs:
  validate:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validate issue structure
        run: python -B src/ember/governance/scripts/github/issue_intake.py --event "$GITHUB_EVENT_PATH"
