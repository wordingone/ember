# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: ci-main

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-main-master
  cancel-in-progress: true

jobs:
  clean-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest==8.4.1" "PyYAML==6.0.2" "jsonschema==4.26.0" "cryptography==49.0.0"
      - name: Repository policy truth
        run: python -B -m unittest discover -s scripts/github -p "test_*.py" -v
      - name: Identity and custody truth
        run: |
          python -B -m pytest -q tests/ember_01_identity/test_validate_identity.py
          python -B scripts/ember_01_custody/verify_c0_failure_class_ledger.py
          python -B -m pytest -q tests/ember_01_custody
  ember-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: runtime/ember-lab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: cargo test --locked
