# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: issue1947 protected eval mechanics

on:
  pull_request:
    paths:
      - ".github/workflows/issue1947-protected-eval-*.yml"
      - "src/ember/governance/scripts/issue1947_release_*.py"
      - "tests/ember_restart_model/domain-governance/test_issue1947_release_*.py"
      - "src/ember/eval_plane/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.10"
      - run: python -m pip install pytest
      - if: hashFiles('tests/ember_restart_model/domain-governance/test_issue1947_release_*.py') != ''
        run: >-
          python -m pytest -p no:cacheprovider -q
          tests/ember_restart_model/domain-governance/test_issue1947_release_preflight.py
          tests/ember_restart_model/domain-governance/test_issue1947_release_execute.py
          tests/ember_restart_model/domain-governance/test_issue1947_release_recompute.py
          --junitxml=issue1947-pr-mechanics.xml
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: issue1947-pr-mechanics
          path: issue1947-pr-mechanics.xml
          retention-days: 30
