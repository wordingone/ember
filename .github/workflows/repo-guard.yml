name: repo-guard
# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember

# Trigger trust is explicit:
# - pull_request_target is the separated trusted-kernel gate: workflow and kernel
#   come from the protected base while the merge ref is hostile data under test.
# - pull_request is a temporary bootstrap trigger: its workflow is head-sourced,
#   but its executable kernel is explicitly checked out from the protected base.
# - push is a same-tree self-check: workflow, kernel, and subject are the pushed
#   commit. It preserves all-branch coverage but is not a separated trust gate.
# Subject-authored guard or helper bytes are never executed as the kernel.
# SECURITY: guard-subject is hostile data. Never run an action, package script,
# executable, shell file, Python import, or other code from that root. Every
# executable byte below must resolve from guard-kernel or the hosted runner.

on:
  push:
  pull_request:
    branches: [master]
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Disable symlink materialization
        run: git config --global core.symlinks false

      - name: Checkout trusted guard kernel
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          # Intentionally omit the ref key: pull_request_target resolves the current
          # protected-base tip; push resolves the triggering protected commit.
          # The hostile merge/push subject is checked out separately below.
          path: guard-kernel
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout bootstrap trusted guard kernel
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: guard-kernel
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pull-request merge subject
        if: github.event_name == 'pull_request_target' || github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: guard-subject
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout master push subject
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: guard-subject
          fetch-depth: 0
          persist-credentials: false

      - name: Run base-pinned repo-guard
        env:
          REPO_GUARD_NAMES: ${{ secrets.REPO_GUARD_NAMES }}
          REPO_GUARD_KERNEL_ROOT: ${{ github.workspace }}/guard-kernel
          REPO_GUARD_SUBJECT_ROOT: ${{ github.workspace }}/guard-subject
          BASE_SHA: ${{ (github.event_name == 'pull_request_target' || github.event_name == 'pull_request') && github.event.pull_request.base.sha || github.event.before }}
        run: |
          kernel="${GITHUB_WORKSPACE}/guard-kernel"
          subject="${GITHUB_WORKSPACE}/guard-subject"
          chmod +x "${kernel}/tools/repo-guard.sh"
          cd "${subject}"
          if ! git cat-file -e "${BASE_SHA}^{commit}"; then
            echo "repo-guard: explicit range base is unavailable; refusing weaker tree-only fallback" >&2
            exit 2
          fi
          bash "${kernel}/tools/repo-guard.sh" --base "${BASE_SHA}"

      - name: Validate PR authority binding
        if: github.event_name == 'pull_request_target' || github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          kernel="${GITHUB_WORKSPACE}/guard-kernel"
          subject="${GITHUB_WORKSPACE}/guard-subject"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""' > "${RUNNER_TEMP}/pr_body.txt"
          cd "${subject}"
          python "${kernel}/scripts/check_pr_authority_binding.py" \
            --root "${subject}" \
            --body-file "${RUNNER_TEMP}/pr_body.txt" \
            --changed-range "${BASE_SHA}..HEAD"
