name: repo-guard
# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember

# Unbypassable server-side ring. Runs the same kernel as the local hook on every
# push and PR. Make this a REQUIRED status check in branch protection so a change
# that violates a structural invariant cannot merge — agents cannot --no-verify
# their way past it.

on:
  push:
  pull_request:
    branches: [master]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need full history for the --base range check
      - name: Run repo-guard
        env:
          # Operator-name denylist injected from a repo secret so the names are
          # never committed. If unset, the kernel skips the name check and still
          # enforces every structural invariant.
          REPO_GUARD_NAMES: ${{ secrets.REPO_GUARD_NAMES }}
        run: |
          chmod +x tools/repo-guard.sh
          if git rev-parse --verify -q origin/master >/dev/null; then
            bash tools/repo-guard.sh --base origin/master
          else
            bash tools/repo-guard.sh
          fi
      - name: Validate PR authority binding
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Read the LIVE PR body via the API rather than
          # github.event.pull_request.body. The event-payload body is a snapshot
          # frozen when the event fired; `gh run rerun` replays that same stale
          # payload, so a body edit never reaches a rerun — only a fresh event
          # (a new push = synchronize, or close/reopen) refreshes it. Fetching
          # the body at run time makes reruns authoritative and matches the
          # tools/pr_authbind_preflight.sh pre-handoff check.
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""' > "${RUNNER_TEMP}/pr_body.txt"
          python scripts/check_pr_authority_binding.py \
            --body-file "${RUNNER_TEMP}/pr_body.txt" \
            --changed-range origin/master..HEAD
