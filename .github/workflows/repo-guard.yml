name: repo-guard
# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember

# Required server-side ring. Pull-request workflow and kernel bytes come from the
# protected base, while the merge ref is data under test. Subject-authored guard,
# helper, or workflow bytes are never executed by this job.
# SECURITY: guard-subject is hostile data. Never run an action, package script,
# executable, shell file, Python import, or other code from that root. Every
# executable byte below must resolve from guard-kernel or the hosted runner.

on:
  push:
    branches: [master]
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Disable symlink materialization
        run: git config --global core.symlinks false

      - name: Checkout trusted guard kernel
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          path: guard-kernel
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pull-request merge subject
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: guard-subject
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout master push subject
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: guard-subject
          fetch-depth: 0
          persist-credentials: false

      - name: Run base-pinned repo-guard
        env:
          REPO_GUARD_NAMES: ${{ secrets.REPO_GUARD_NAMES }}
          REPO_GUARD_KERNEL_ROOT: ${{ github.workspace }}/guard-kernel
          REPO_GUARD_SUBJECT_ROOT: ${{ github.workspace }}/guard-subject
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          kernel="${GITHUB_WORKSPACE}/guard-kernel"
          subject="${GITHUB_WORKSPACE}/guard-subject"
          chmod +x "${kernel}/tools/repo-guard.sh"
          cd "${subject}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request_target" ]; then
            git cat-file -e "${BASE_SHA}^{commit}"
            bash "${kernel}/tools/repo-guard.sh" --base "${BASE_SHA}"
          else
            bash "${kernel}/tools/repo-guard.sh"
          fi

      - name: Validate PR authority binding
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          kernel="${GITHUB_WORKSPACE}/guard-kernel"
          subject="${GITHUB_WORKSPACE}/guard-subject"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""' > "${RUNNER_TEMP}/pr_body.txt"
          cd "${subject}"
          python "${kernel}/scripts/check_pr_authority_binding.py" \
            --root "${subject}" \
            --body-file "${RUNNER_TEMP}/pr_body.txt" \
            --changed-range "${BASE_SHA}..HEAD"
