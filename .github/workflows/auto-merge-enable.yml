name: auto-merge-enable
# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember

# Enable GitHub auto-merge on eligible pull requests.
#
# Why this exists: merging was a manual act performed by one actor, so PRs that
# were already MERGEABLE, CLEAN, non-draft and green sat unmerged. The open-PR
# count is a reading of that bottleneck, not a number to manage by hand.
# Draining the queue by hand does not remove the bottleneck; making the merge an
# EVENT rather than a human click does.
#
# This workflow never merges anything itself. It only asks GitHub to merge the
# PR once branch protection is satisfied. Protection on master requires:
#   - the `guard` and `compiled-lifecycle` checks to pass at the exact head, and
#   - one approving review.
# So the review gate and the CI gate are untouched: a PR still cannot land red,
# and it still cannot land unreviewed. What changes is that a PR which HAS
# satisfied both no longer waits for someone to notice.
#
# Effect: eligible pull requests land on green + approval without a manual merge
# step, so the open-PR count reflects work in flight rather than review-queue
# latency.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  schedule:
    # Sweep every 30 minutes so PRs opened before this workflow existed, and any
    # PR whose eligibility changed without emitting an event, are also enrolled.
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-enable-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  enable:
    name: enable-auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: Enroll eligible pull requests in auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          # Paths whose changes are never enrolled. These carry authority,
          # identity, or the automation itself; each needs a deliberate human
          # merge even when green and approved. A PR touching ANY of them is
          # skipped in full — the exclusion is per-PR, not per-file.
          PROTECTED_RE='^(INVARIANT\.md|GOAL\.md|\.github/workflows/|docs/authority/|goals/|constitution)'

          if [ -n "${EVENT_PR:-}" ]; then
            PRS="$EVENT_PR"
          else
            PRS=$(gh pr list --repo "$REPO" --state open --limit 200 \
                    --json number --jq '.[].number')
          fi

          for pr in $PRS; do
            meta=$(gh pr view "$pr" --repo "$REPO" \
                     --json number,isDraft,mergeStateStatus,autoMergeRequest,baseRefName,files,changedFiles \
                     2>/dev/null) || { echo "pr #$pr: unreadable, skipping"; continue; }

            is_draft=$(jq -r '.isDraft' <<<"$meta")
            base=$(jq -r '.baseRefName' <<<"$meta")
            already=$(jq -r 'if .autoMergeRequest == null then "no" else "yes" end' <<<"$meta")

            if [ "$is_draft" = "true" ]; then
              echo "pr #$pr: draft, skipping"; continue
            fi
            if [ "$base" != "master" ]; then
              echo "pr #$pr: base $base is not master, skipping"; continue
            fi
            if [ "$already" = "yes" ]; then
              echo "pr #$pr: auto-merge already enabled"; continue
            fi

            # Fail CLOSED on the protected-path check: if the file list cannot be
            # read, the PR is skipped rather than enrolled. An unreadable file
            # list is indistinguishable from a protected one, so it is treated as
            # protected.
            if ! paths=$(jq -er '.files[].path' <<<"$meta"); then
              echo "pr #$pr: file list unreadable, skipping (fail-closed)"; continue
            fi

            # The files array is capped by the API (100 entries). A PR larger
            # than the cap returns a TRUNCATED list, so a protected path sitting
            # past the cap would be invisible to the grep above and the PR would
            # be enrolled while touching a file this workflow is meant to
            # exclude. Compare the returned length against the PR's own declared
            # changed-file count and skip on any mismatch: a list that does not
            # account for every changed file cannot answer the question being
            # asked of it.
            listed=$(jq -r '.files | length' <<<"$meta")
            declared=$(jq -r '.changedFiles' <<<"$meta")
            if [ "$listed" != "$declared" ]; then
              echo "pr #$pr: file list truncated ($listed of $declared), skipping (fail-closed)"
              continue
            fi

            if grep -qE "$PROTECTED_RE" <<<"$paths"; then
              echo "pr #$pr: touches a protected path, skipping (manual merge)"; continue
            fi

            # --auto queues the merge. Branch protection still decides IF and
            # WHEN it happens: required checks green at the exact head, plus one
            # approving review. A failure here is not fatal to the sweep — some
            # PRs are transiently ineligible (mergeability still being computed
            # by GitHub, or a conflict) and the next run picks them up.
            if gh pr merge "$pr" --repo "$REPO" --auto --squash 2>&1; then
              echo "pr #$pr: auto-merge enabled"
            else
              echo "pr #$pr: could not enable auto-merge yet (will retry next sweep)"
            fi
          done
