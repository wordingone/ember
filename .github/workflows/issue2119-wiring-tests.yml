# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: issue2119-wiring-tests

# Runs the issue 2119 head-wiring test files on ubuntu-latest with the job log naming every test (pytest -v). The files are the 02B tool tests:
# the cadence gate, the fresh-session load, the publish crash sweep, the pending-continuation CLI and the continuity status sources, plus the page
# files ci-pr already runs. All nine files must be present (a missing file fails the job; there is no skip), each must collect tests, the collected
# total must equal the expected count, and the run must end with exactly that many passed and no skipped, deselected, xfailed, xpassed, failed or error.
# The file list and the expected count are read from tests/ember_restart_model/issue2119_wiring_manifest.json (EMBER-02B), so a test and its count change in one reviewed edit.
# The nine existing files stay a fixed REQUIRED floor written in this workflow: the manifest may add files, it cannot drop one.

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/issue2119-wiring-tests.yml"
      - "src/ember/infrastructure/tools/ember-restart-3b/**"
      - "tests/ember_restart_model/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue2119-wiring-tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

jobs:
  wiring-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WIRING_MANIFEST: tests/ember_restart_model/issue2119_wiring_manifest.json
      # The mandatory floor: the nine existing suites. The manifest may add files and set the exact count; it cannot drop one of these.
      WIRING_REQUIRED: "tests/ember_restart_model/test_issue2119_post_hour_promotion_gate.py tests/ember_restart_model/test_issue2119_fresh_session_head_load.py tests/ember_restart_model/test_issue2119_publish_crash_sweep.py tests/ember_restart_model/test_issue2119_pending_continuation_cli.py tests/ember_restart_model/test_issue2119_continuity_sources.py tests/ember_restart_model/test_issue2119_continuity_page.py tests/ember_restart_model/test_issue2119_snapshot_hook.py tests/ember_restart_model/test_issue2119_lineage_candidate_audit.py tests/ember_restart_model/test_issue2119_continuity_page_live.py"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest==8.4.1" "PyYAML==6.0.2" "jsonschema==4.26.0" "cryptography==49.0.0" "huggingface_hub==1.22.0" "tokenizers==0.22.2" "numpy==2.2.6"
      - run: python -m pip install "torch==2.13.0" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --editable .
      - name: Guard that all nine wiring test files are present with the exact collected count
        run: |
          set -euo pipefail
          test -f "$WIRING_MANIFEST" || { echo "the wiring manifest is missing: $WIRING_MANIFEST"; exit 1; }
          python -B -c 'import json,sys; m=json.load(open(sys.argv[1], encoding="utf-8")); listed=set(m["new_files"]+m["page_files"]); gone=[f for f in sys.argv[2:] if f not in listed]; print("required wiring test files absent from the manifest: "+" ".join(gone)) if gone else None; sys.exit(1 if gone else 0)' "$WIRING_MANIFEST" $WIRING_REQUIRED
          all="$(python -B -c 'import json,sys; m=json.load(open(sys.argv[1], encoding="utf-8")); assert m["schema"]=="ember-issue2119-wiring-manifest-v1"; print(" ".join(m["new_files"]+m["page_files"]))' "$WIRING_MANIFEST")"
          expected="$(python -B -c 'import json,sys; m=json.load(open(sys.argv[1], encoding="utf-8")); print(int(m["expected_tests"]))' "$WIRING_MANIFEST")"
          test -n "$all"
          test "$expected" -ge 1
          echo "WIRING_ALL=$all" >> "${GITHUB_ENV:-/dev/null}"
          echo "WIRING_EXPECTED_TESTS=$expected" >> "${GITHUB_ENV:-/dev/null}"
          absent=""
          for file in $all; do
            if ! test -f "$file"; then absent="$absent $file"; fi
          done
          if test -n "$absent"; then echo "these listed wiring test files are missing:$absent"; exit 1; fi
          python -B -m pytest --collect-only -q -p no:cacheprovider $all > collected.txt
          for file in $all; do
            count="$(grep -c "^${file}::" collected.txt || true)"
            echo "$file collected=$count"
            test "$count" -ge 1
          done
          total="$(grep -Ec '^tests/[^ ]+::' collected.txt || true)"
          echo "collected total=$total expected=$expected"
          test "$total" -eq "$expected"
      - name: Run the issue 2119 wiring tests (each test named in the log); no skip, deselect, xfail or error is accepted
        run: |
          set -euo pipefail
          python -B -m pytest -v -rs -p no:cacheprovider $WIRING_ALL | tee run.txt
          summary="$(grep -E '^=+ .* in [0-9.]+s' run.txt | tail -1)"
          echo "summary: $summary"
          echo "$summary" | grep -Eq "^=+ ${WIRING_EXPECTED_TESTS} passed in [0-9.]+s"
          if echo "$summary" | grep -Eq 'skipped|deselected|xfailed|xpassed|failed|error'; then echo "a test was skipped, deselected or did not pass"; exit 1; fi
