# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: issue2119-wiring-tests

# Runs the issue 2119 head-wiring test files on ubuntu-latest with the job log naming every test (pytest -v). The files are the 02B tool tests:
# the cadence gate, the fresh-session load, the publish crash sweep, the pending-continuation CLI and the continuity status sources, plus the page
# files ci-pr already runs. The guard skips the job ONLY when none of the five new files is in the tree (the base, so this workflow can merge before
# they do; the four page files are already on master). Once any new file is present, all nine must be, each must collect tests, the collected total
# must equal WIRING_EXPECTED_TESTS, and the run must end with exactly that many passed and no skipped, deselected, xfailed, xpassed, failed or error.
# Changing the count needs a new reviewed workflow edit.

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/issue2119-wiring-tests.yml"
      - "src/ember/infrastructure/tools/ember-restart-3b/**"
      - "tests/ember_restart_model/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue2119-wiring-tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

jobs:
  wiring-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WIRING_EXPECTED_TESTS: "196"
      WIRING_NEW_FILES: >-
        tests/ember_restart_model/test_issue2119_post_hour_promotion_gate.py
        tests/ember_restart_model/test_issue2119_fresh_session_head_load.py
        tests/ember_restart_model/test_issue2119_publish_crash_sweep.py
        tests/ember_restart_model/test_issue2119_pending_continuation_cli.py
        tests/ember_restart_model/test_issue2119_continuity_sources.py
      WIRING_PAGE_FILES: >-
        tests/ember_restart_model/test_issue2119_continuity_page.py
        tests/ember_restart_model/test_issue2119_snapshot_hook.py
        tests/ember_restart_model/test_issue2119_lineage_candidate_audit.py
        tests/ember_restart_model/test_issue2119_continuity_page_live.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest==8.4.1" "PyYAML==6.0.2" "jsonschema==4.26.0" "cryptography==49.0.0" "huggingface_hub==1.22.0" "tokenizers==0.22.2" "numpy==2.2.6"
      - run: python -m pip install "torch==2.13.0" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --editable .
      - name: Guard that the new wiring test files are all absent (base) or all present with the exact collected count
        run: |
          set -euo pipefail
          all="$WIRING_NEW_FILES $WIRING_PAGE_FILES"
          new_present=""
          absent=""
          for file in $WIRING_NEW_FILES; do
            if test -f "$file"; then new_present="$new_present $file"; fi
          done
          for file in $all; do
            if ! test -f "$file"; then absent="$absent $file"; fi
          done
          if test -z "$new_present"; then
            echo "none of the new wiring test files is in this tree (the base): nothing to run"
            echo "WIRING_RUN=no" >> "$GITHUB_ENV"
            exit 0
          fi
          if test -n "$absent"; then echo "new wiring test files are present but these listed files are missing:$absent"; exit 1; fi
          python -B -m pytest --collect-only -q -p no:cacheprovider $all > collected.txt
          for file in $all; do
            count="$(grep -c "^${file}::" collected.txt || true)"
            echo "$file collected=$count"
            test "$count" -ge 1
          done
          total="$(grep -Ec '^tests/[^ ]+::' collected.txt || true)"
          echo "collected total=$total expected=$WIRING_EXPECTED_TESTS"
          test "$total" -eq "$WIRING_EXPECTED_TESTS"
          echo "WIRING_RUN=yes" >> "$GITHUB_ENV"
      - name: Run the issue 2119 wiring tests (each test named in the log); no skip, deselect, xfail or error is accepted
        run: |
          set -euo pipefail
          if test "$WIRING_RUN" != "yes"; then echo "nothing to run"; exit 0; fi
          python -B -m pytest -v -rs -p no:cacheprovider $WIRING_NEW_FILES $WIRING_PAGE_FILES | tee run.txt
          summary="$(grep -E '^=+ .* in [0-9.]+s' run.txt | tail -1)"
          echo "summary: $summary"
          echo "$summary" | grep -Eq "^=+ ${WIRING_EXPECTED_TESTS} passed( |,)"
          if echo "$summary" | grep -Eq 'skipped|deselected|xfailed|xpassed|failed|error'; then echo "a test was skipped, deselected or did not pass"; exit 1; fi
