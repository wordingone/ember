# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: cli-windows-lifecycle-e2e

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:

permissions:
  contents: read

concurrency:
  group: compiled-lifecycle-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  compiled-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.12
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install pinned validator dependencies
        run: python -m pip install "cryptography==49.0.0" "jsonschema==4.26.0"
      - name: Install lockfile-pinned CLI dependencies
        working-directory: tools/ember-cli/src
        run: bun install --frozen-lockfile
      - name: Verify lifecycle refusal matrix
        working-directory: tools/ember-cli/src
        run: bun test build-tools/lifecycle-smoke.test.ts
      - name: Build exact compiled Ember CLI
        working-directory: tools/ember-cli/src
        run: bun run build
      - name: Drive real lifecycle through ConPTY
        working-directory: tools/ember-cli/src
        run: >
          node --experimental-strip-types build-tools/lifecycle-smoke-driver.ts
          --binary ember.exe
          --out-dir ../../../receipts/ember-cli-lifecycle-smoke
          --receipt-path ../../../receipts/ember-cli-lifecycle-smoke/receipt.json
      - name: Retain lifecycle evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ember-cli-lifecycle-smoke-${{ github.sha }}
          path: receipts/ember-cli-lifecycle-smoke
          if-no-files-found: error
