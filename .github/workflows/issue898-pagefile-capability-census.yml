# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: "Issue 898: Windows pagefile capability census"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue898-pagefile-capability-census
  cancel-in-progress: false

jobs:
  native-census:
    name: "native-census (${{ matrix.image }})"
    strategy:
      fail-fast: false
      matrix:
        image:
          - windows-latest
          - windows-2025
          - windows-2022
          - windows-11-arm
          - windows-11-vs2026-arm
    runs-on: ${{ matrix.image }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Read native pagefile capability without mutation
        working-directory: runtime/ember-lab
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $example = Join-Path $PWD 'examples\issue898_pagefile_capability_probe.rs'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $example) | Out-Null
          @'
          #[cfg(not(windows))]
          compile_error!("issue898 pagefile capability probe is Windows-only");

          use ember_lab::probe_host_commit_capacity;
          use serde_json::json;
          use windows_sys::Win32::System::ProcessStatus::{
              GetPerformanceInfo, PERFORMANCE_INFORMATION,
          };

          fn checked_bytes(pages: usize, page_size: u64, label: &str) -> u64 {
              (pages as u64)
                  .checked_mul(page_size)
                  .unwrap_or_else(|| panic!("live GetPerformanceInfo overflowed {label}"))
          }

          fn main() {
              let mut info: PERFORMANCE_INFORMATION = unsafe { std::mem::zeroed() };
              info.cb = std::mem::size_of::<PERFORMANCE_INFORMATION>() as u32;
              assert_ne!(
                  unsafe { GetPerformanceInfo(&mut info, info.cb) },
                  0,
                  "GetPerformanceInfo failed: {}",
                  std::io::Error::last_os_error()
              );
              let page_size = info.PageSize as u64;
              let physical_ram_bytes =
                  checked_bytes(info.PhysicalTotal, page_size, "physical RAM bytes");
              let commit_total_bytes =
                  checked_bytes(info.CommitTotal, page_size, "committed bytes");
              let commit_limit_bytes =
                  checked_bytes(info.CommitLimit, page_size, "commit limit bytes");
              let commit_remaining_bytes = commit_limit_bytes
                  .checked_sub(commit_total_bytes)
                  .expect("live committed bytes exceed live commit limit");
              let runtime_probe = match probe_host_commit_capacity() {
                  Ok(capacity) => json!({
                      "verdict": "ACCEPT",
                      "pagefile_maximum_bytes": capacity.pagefile_maximum_bytes,
                      "pagefile_configuration_sha256": capacity.pagefile_configuration_sha256,
                      "maximum_commit_capacity_bytes": capacity.maximum_commit_capacity_bytes,
                      "available_maximum_commit_bytes": capacity.available_maximum_commit_bytes,
                  }),
                  Err(error) => json!({
                      "verdict": "REFUSE",
                      "detail": error.to_string(),
                  }),
              };
              println!(
                  "{}",
                  serde_json::to_string(&json!({
                      "schema_version": "ember-issue898-pagefile-capability-runtime-v1",
                      "live": {
                          "page_size_bytes": page_size,
                          "physical_ram_bytes": physical_ram_bytes,
                          "commit_total_bytes": commit_total_bytes,
                          "commit_limit_bytes": commit_limit_bytes,
                          "commit_remaining_bytes": commit_remaining_bytes,
                      },
                      "runtime_probe": runtime_probe,
                  }))
                  .expect("serialize runtime capability")
              );
          }
          '@ | Set-Content -LiteralPath $example -Encoding utf8NoBOM

          $registryPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management'
          $raw = @((Get-ItemPropertyValue -LiteralPath $registryPath -Name PagingFiles))
          Write-Output 'PAGINGFILES_RAW_BEGIN'
          $raw | ForEach-Object { Write-Output $_ }
          Write-Output 'PAGINGFILES_RAW_END'
          $computer = Get-CimInstance -ClassName Win32_ComputerSystem
          Write-Output ('AUTOMATIC_MANAGED_PAGEFILE=' + $computer.AutomaticManagedPagefile)
          $settings = @(Get-CimInstance -ClassName Win32_PageFileSetting |
            Select-Object Name, InitialSize, MaximumSize)
          Write-Output ('PAGEFILE_SETTINGS=' + ($settings | ConvertTo-Json -Compress -Depth 4))
          $runtime = & cargo run --locked --quiet --example issue898_pagefile_capability_probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output ('RUNTIME_CAPABILITY=' + $runtime)
          Remove-Item -LiteralPath $example -Force

  mutation-boundary-census:
    name: "boundary (${{ matrix.mutation_shape }}, ${{ matrix.fixed_mib }} MiB)"
    strategy:
      fail-fast: false
      matrix:
        mutation_shape:
          - delete_create
          - update_existing
        fixed_mib:
          - 24576
          - 20480
          - 18432
          - 16384
          - 14336
          - 12288
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Measure one pagefile size and mutation shape
        working-directory: runtime/ember-lab
        shell: pwsh
        env:
          FIXED_MIB: ${{ matrix.fixed_mib }}
          MUTATION_SHAPE: ${{ matrix.mutation_shape }}
          CENSUS_ROOT: ${{ runner.temp }}\issue898-pagefile-boundary-${{ github.run_id }}-${{ matrix.mutation_shape }}-${{ matrix.fixed_mib }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath $env:CENSUS_ROOT) {
            throw "no-overwrite census root already exists: $env:CENSUS_ROOT"
          }
          [System.IO.Directory]::CreateDirectory($env:CENSUS_ROOT) | Out-Null
          $resultPath = Join-Path $env:CENSUS_ROOT 'result.json'
          $example = Join-Path $PWD 'examples\issue898_pagefile_capability_probe.rs'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $example) | Out-Null
          @'
          #[cfg(not(windows))]
          compile_error!("issue898 pagefile capability probe is Windows-only");

          use ember_lab::probe_host_commit_capacity;
          use serde_json::json;
          use windows_sys::Win32::System::ProcessStatus::{
              GetPerformanceInfo, PERFORMANCE_INFORMATION,
          };

          fn checked_bytes(pages: usize, page_size: u64, label: &str) -> u64 {
              (pages as u64)
                  .checked_mul(page_size)
                  .unwrap_or_else(|| panic!("live GetPerformanceInfo overflowed {label}"))
          }

          fn main() {
              let mut info: PERFORMANCE_INFORMATION = unsafe { std::mem::zeroed() };
              info.cb = std::mem::size_of::<PERFORMANCE_INFORMATION>() as u32;
              assert_ne!(
                  unsafe { GetPerformanceInfo(&mut info, info.cb) },
                  0,
                  "GetPerformanceInfo failed: {}",
                  std::io::Error::last_os_error()
              );
              let page_size = info.PageSize as u64;
              let physical_ram_bytes =
                  checked_bytes(info.PhysicalTotal, page_size, "physical RAM bytes");
              let commit_total_bytes =
                  checked_bytes(info.CommitTotal, page_size, "committed bytes");
              let commit_limit_bytes =
                  checked_bytes(info.CommitLimit, page_size, "commit limit bytes");
              let commit_remaining_bytes = commit_limit_bytes
                  .checked_sub(commit_total_bytes)
                  .expect("live committed bytes exceed live commit limit");
              let runtime_probe = match probe_host_commit_capacity() {
                  Ok(capacity) => json!({
                      "verdict": "ACCEPT",
                      "pagefile_maximum_bytes": capacity.pagefile_maximum_bytes,
                      "pagefile_configuration_sha256": capacity.pagefile_configuration_sha256,
                      "maximum_commit_capacity_bytes": capacity.maximum_commit_capacity_bytes,
                      "available_maximum_commit_bytes": capacity.available_maximum_commit_bytes,
                  }),
                  Err(error) => json!({
                      "verdict": "REFUSE",
                      "detail": error.to_string(),
                  }),
              };
              println!(
                  "{}",
                  serde_json::to_string(&json!({
                      "schema_version": "ember-issue898-pagefile-capability-runtime-v1",
                      "live": {
                          "page_size_bytes": page_size,
                          "physical_ram_bytes": physical_ram_bytes,
                          "commit_total_bytes": commit_total_bytes,
                          "commit_limit_bytes": commit_limit_bytes,
                          "commit_remaining_bytes": commit_remaining_bytes,
                      },
                      "runtime_probe": runtime_probe,
                  }))
                  .expect("serialize runtime capability")
              );
          }
          '@ | Set-Content -LiteralPath $example -Encoding utf8NoBOM

          function Get-CapabilitySnapshot([string] $Phase) {
            $registryPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management'
            $raw = [string[]]@((Get-ItemPropertyValue -LiteralPath $registryPath -Name PagingFiles))
            $computer = Get-CimInstance -ClassName Win32_ComputerSystem
            $settings = @(Get-CimInstance -ClassName Win32_PageFileSetting |
              Select-Object Name, InitialSize, MaximumSize)
            $runtimeText = & cargo run --locked --quiet --example issue898_pagefile_capability_probe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            [pscustomobject]@{
              schema_version = 'ember-issue898-pagefile-capability-snapshot-v1'
              phase = $Phase
              raw_paging_files = $raw
              automatic_managed_pagefile = [bool]$computer.AutomaticManagedPagefile
              pagefile_settings = $settings
              runtime = ($runtimeText | ConvertFrom-Json)
            }
          }

          $before = Get-CapabilitySnapshot 'BEFORE'
          $tempDrive = (Get-Item -LiteralPath $env:RUNNER_TEMP).PSDrive.Root.TrimEnd('\')
          $driveId = $tempDrive.TrimEnd(':') + ':'
          $logicalDisk = Get-CimInstance -ClassName Win32_LogicalDisk -Filter "DeviceID='$driveId'"
          if ($null -eq $logicalDisk) { throw "no logical disk for RUNNER_TEMP drive $driveId" }
          $reserveBytes = [uint64]4GB
          $fixedMiB = [uint32]$env:FIXED_MIB
          $fixedBytes = [uint64]$fixedMiB * [uint64]1MB
          if ([uint64]$logicalDisk.FreeSpace -lt $reserveBytes + $fixedBytes) {
            throw "RUNNER_TEMP drive cannot preserve the fixed 4 GiB reserve at $fixedMiB MiB"
          }
          $pagefileName = "$driveId\pagefile.sys"

          $mutationFault = $null
          try {
            $computer = Get-CimInstance -ClassName Win32_ComputerSystem
            Set-CimInstance -InputObject $computer -Property @{ AutomaticManagedPagefile = $false } | Out-Null
            if ($env:MUTATION_SHAPE -eq 'delete_create') {
              @(Get-CimInstance -ClassName Win32_PageFileSetting) |
                ForEach-Object { Remove-CimInstance -InputObject $_ }
              New-CimInstance -ClassName Win32_PageFileSetting -Property @{
                Name = $pagefileName
                InitialSize = $fixedMiB
                MaximumSize = $fixedMiB
              } | Out-Null
            } elseif ($env:MUTATION_SHAPE -eq 'update_existing') {
              $sameDrive = @(Get-CimInstance -ClassName Win32_PageFileSetting |
                Where-Object { $_.Name -ieq $pagefileName })
              if ($sameDrive.Count -ne 1) {
                throw "update_existing requires exactly one $pagefileName setting; observed $($sameDrive.Count)"
              }
              Set-CimInstance -InputObject $sameDrive[0] -Property @{
                InitialSize = $fixedMiB
                MaximumSize = $fixedMiB
              } | Out-Null
            } else {
              throw "unknown mutation shape: $env:MUTATION_SHAPE"
            }
          } catch {
            $mutationFault = $_.Exception.ToString()
          }

          $after = $null
          $snapshotFault = $null
          try {
            $after = Get-CapabilitySnapshot 'AFTER'
          } catch {
            $snapshotFault = $_.Exception.ToString()
          }
          $runtimeAccepted = $null -ne $after -and
            $after.runtime.runtime_probe.verdict -eq 'ACCEPT'
          $result = if ($null -eq $mutationFault -and $null -eq $snapshotFault -and
              $runtimeAccepted) { 'ACCEPTED' } else { 'REFUSED' }
          $faultText = if ($null -ne $mutationFault) {
            $mutationFault
          } elseif ($null -ne $snapshotFault) {
            $snapshotFault
          } elseif (-not $runtimeAccepted) {
            [string]$after.runtime.runtime_probe.detail
          } else { $null }
          $record = [ordered]@{
            schema_version = 'ember-issue898-pagefile-boundary-census-v1'
            recorded_at_ms = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
            result = $result
            fault_text = $faultText
            mutation_shape = $env:MUTATION_SHAPE
            requested_pagefile_mib = $fixedMiB
            requested_pagefile_bytes = $fixedBytes
            disk_reserve_bytes = $reserveBytes
            runner_temp_drive = $driveId
            raw_paging_files_before = $before.raw_paging_files
            automatic_managed_before = $before.automatic_managed_pagefile
            before_runtime = $before.runtime
            raw_paging_files_after = if ($null -ne $after) { $after.raw_paging_files } else { $null }
            automatic_managed_after = if ($null -ne $after) { $after.automatic_managed_pagefile } else { $null }
            after_runtime = if ($null -ne $after) { $after.runtime } else { $null }
            measured_commit_limit_bytes = if ($runtimeAccepted) {
              [uint64]$after.runtime.live.commit_limit_bytes
            } else { $null }
            measured_commit_total_bytes = if ($runtimeAccepted) {
              [uint64]$after.runtime.live.commit_total_bytes
            } else { $null }
            measured_commit_remaining_bytes = if ($runtimeAccepted) {
              [uint64]$after.runtime.live.commit_remaining_bytes
            } else { $null }
            runtime_declared_maximum_commit_capacity_bytes = if ($runtimeAccepted) {
              [uint64]$after.runtime.runtime_probe.maximum_commit_capacity_bytes
            } else { $null }
          }
          $bytes = [System.Text.UTF8Encoding]::new($false).GetBytes(
            (($record | ConvertTo-Json -Depth 10) + "`n")
          )
          $stream = [System.IO.File]::Open($resultPath, [System.IO.FileMode]::CreateNew,
            [System.IO.FileAccess]::Write, [System.IO.FileShare]::Read)
          try {
            $stream.Write($bytes, 0, $bytes.Length)
            $stream.Flush($true)
          } finally {
            $stream.Dispose()
          }
          Write-Output ('BOUNDARY_RESULT=' + ($record | ConvertTo-Json -Compress -Depth 10))
          Remove-Item -LiteralPath $example -Force

      - name: Upload boundary census record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue898-pagefile-boundary-${{ github.run_id }}-${{ matrix.mutation_shape }}-${{ matrix.fixed_mib }}
          path: ${{ runner.temp }}/issue898-pagefile-boundary-${{ github.run_id }}-${{ matrix.mutation_shape }}-${{ matrix.fixed_mib }}
          if-no-files-found: error
          retention-days: 30
