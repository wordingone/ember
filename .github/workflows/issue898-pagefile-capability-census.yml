# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: "Issue 898: Windows pagefile capability census"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue898-pagefile-capability-census
  cancel-in-progress: false

jobs:
  native-census:
    name: "native-census (${{ matrix.image }})"
    strategy:
      fail-fast: false
      matrix:
        image:
          - windows-latest
          - windows-2025
          - windows-2022
          - windows-11-arm
          - windows-11-vs2026-arm
    runs-on: ${{ matrix.image }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Read native pagefile capability without mutation
        working-directory: runtime/ember-lab
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $example = Join-Path $PWD 'examples\issue898_pagefile_capability_probe.rs'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $example) | Out-Null
          @'
          #[cfg(not(windows))]
          compile_error!("issue898 pagefile capability probe is Windows-only");

          use ember_lab::probe_host_commit_capacity;
          use serde_json::json;
          use windows_sys::Win32::System::ProcessStatus::{
              GetPerformanceInfo, PERFORMANCE_INFORMATION,
          };

          fn checked_bytes(pages: usize, page_size: u64, label: &str) -> u64 {
              (pages as u64)
                  .checked_mul(page_size)
                  .unwrap_or_else(|| panic!("live GetPerformanceInfo overflowed {label}"))
          }

          fn main() {
              let mut info: PERFORMANCE_INFORMATION = unsafe { std::mem::zeroed() };
              info.cb = std::mem::size_of::<PERFORMANCE_INFORMATION>() as u32;
              assert_ne!(
                  unsafe { GetPerformanceInfo(&mut info, info.cb) },
                  0,
                  "GetPerformanceInfo failed: {}",
                  std::io::Error::last_os_error()
              );
              let page_size = info.PageSize as u64;
              let physical_ram_bytes =
                  checked_bytes(info.PhysicalTotal, page_size, "physical RAM bytes");
              let commit_total_bytes =
                  checked_bytes(info.CommitTotal, page_size, "committed bytes");
              let commit_limit_bytes =
                  checked_bytes(info.CommitLimit, page_size, "commit limit bytes");
              let commit_remaining_bytes = commit_limit_bytes
                  .checked_sub(commit_total_bytes)
                  .expect("live committed bytes exceed live commit limit");
              let runtime_probe = match probe_host_commit_capacity() {
                  Ok(capacity) => json!({
                      "verdict": "ACCEPT",
                      "pagefile_maximum_bytes": capacity.pagefile_maximum_bytes,
                      "pagefile_configuration_sha256": capacity.pagefile_configuration_sha256,
                      "maximum_commit_capacity_bytes": capacity.maximum_commit_capacity_bytes,
                      "available_maximum_commit_bytes": capacity.available_maximum_commit_bytes,
                  }),
                  Err(error) => json!({
                      "verdict": "REFUSE",
                      "detail": error.to_string(),
                  }),
              };
              println!(
                  "{}",
                  serde_json::to_string(&json!({
                      "schema_version": "ember-issue898-pagefile-capability-runtime-v1",
                      "live": {
                          "page_size_bytes": page_size,
                          "physical_ram_bytes": physical_ram_bytes,
                          "commit_total_bytes": commit_total_bytes,
                          "commit_limit_bytes": commit_limit_bytes,
                          "commit_remaining_bytes": commit_remaining_bytes,
                      },
                      "runtime_probe": runtime_probe,
                  }))
                  .expect("serialize runtime capability")
              );
          }
          '@ | Set-Content -LiteralPath $example -Encoding utf8NoBOM

          $registryPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management'
          $raw = @((Get-ItemPropertyValue -LiteralPath $registryPath -Name PagingFiles))
          Write-Output 'PAGINGFILES_RAW_BEGIN'
          $raw | ForEach-Object { Write-Output $_ }
          Write-Output 'PAGINGFILES_RAW_END'
          $computer = Get-CimInstance -ClassName Win32_ComputerSystem
          Write-Output ('AUTOMATIC_MANAGED_PAGEFILE=' + $computer.AutomaticManagedPagefile)
          $settings = @(Get-CimInstance -ClassName Win32_PageFileSetting |
            Select-Object Name, InitialSize, MaximumSize)
          Write-Output ('PAGEFILE_SETTINGS=' + ($settings | ConvertTo-Json -Compress -Depth 4))
          $runtime = & cargo run --locked --quiet --example issue898_pagefile_capability_probe
          if ($LASTEXITCODE -ne 0) {
            throw "pagefile capability helper exited $LASTEXITCODE"
          }
          Write-Output ('RUNTIME_CAPABILITY=' + $runtime)
          Remove-Item -LiteralPath $example -Force

  mutation-boundary-census:
    name: "boundary (${{ matrix.mutation_shape }}, ${{ matrix.fixed_mib }} MiB)"
    strategy:
      fail-fast: false
      matrix:
        mutation_shape:
          - pin_all_fixed
        fixed_mib:
          - 24576
          - 20480
          - 18432
          - 16384
          - 14336
          - 12288
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Measure one pagefile size and mutation shape
        working-directory: runtime/ember-lab
        shell: pwsh
        env:
          FIXED_MIB: ${{ matrix.fixed_mib }}
          MUTATION_SHAPE: ${{ matrix.mutation_shape }}
          CENSUS_ROOT: ${{ runner.temp }}\issue898-pagefile-boundary-${{ github.run_id }}-${{ matrix.mutation_shape }}-${{ matrix.fixed_mib }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath $env:CENSUS_ROOT) {
            throw "no-overwrite census root already exists: $env:CENSUS_ROOT"
          }
          [System.IO.Directory]::CreateDirectory($env:CENSUS_ROOT) | Out-Null
          $resultPath = Join-Path $env:CENSUS_ROOT 'result.json'
          $example = Join-Path $PWD 'examples\issue898_pagefile_capability_probe.rs'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $example) | Out-Null
          @'
          #[cfg(not(windows))]
          compile_error!("issue898 pagefile capability probe is Windows-only");

          use ember_lab::probe_host_commit_capacity;
          use serde_json::json;
          use windows_sys::Win32::System::ProcessStatus::{
              GetPerformanceInfo, PERFORMANCE_INFORMATION,
          };

          fn checked_bytes(pages: usize, page_size: u64, label: &str) -> u64 {
              (pages as u64)
                  .checked_mul(page_size)
                  .unwrap_or_else(|| panic!("live GetPerformanceInfo overflowed {label}"))
          }

          fn main() {
              let mut info: PERFORMANCE_INFORMATION = unsafe { std::mem::zeroed() };
              info.cb = std::mem::size_of::<PERFORMANCE_INFORMATION>() as u32;
              assert_ne!(
                  unsafe { GetPerformanceInfo(&mut info, info.cb) },
                  0,
                  "GetPerformanceInfo failed: {}",
                  std::io::Error::last_os_error()
              );
              let page_size = info.PageSize as u64;
              let physical_ram_bytes =
                  checked_bytes(info.PhysicalTotal, page_size, "physical RAM bytes");
              let commit_total_bytes =
                  checked_bytes(info.CommitTotal, page_size, "committed bytes");
              let commit_limit_bytes =
                  checked_bytes(info.CommitLimit, page_size, "commit limit bytes");
              let commit_remaining_bytes = commit_limit_bytes
                  .checked_sub(commit_total_bytes)
                  .expect("live committed bytes exceed live commit limit");
              let runtime_probe = match probe_host_commit_capacity() {
                  Ok(capacity) => json!({
                      "verdict": "ACCEPT",
                      "pagefile_maximum_bytes": capacity.pagefile_maximum_bytes,
                      "pagefile_configuration_sha256": capacity.pagefile_configuration_sha256,
                      "maximum_commit_capacity_bytes": capacity.maximum_commit_capacity_bytes,
                      "available_maximum_commit_bytes": capacity.available_maximum_commit_bytes,
                  }),
                  Err(error) => json!({
                      "verdict": "REFUSE",
                      "detail": error.to_string(),
                  }),
              };
              println!(
                  "{}",
                  serde_json::to_string(&json!({
                      "schema_version": "ember-issue898-pagefile-capability-runtime-v1",
                      "live": {
                          "page_size_bytes": page_size,
                          "physical_ram_bytes": physical_ram_bytes,
                          "commit_total_bytes": commit_total_bytes,
                          "commit_limit_bytes": commit_limit_bytes,
                          "commit_remaining_bytes": commit_remaining_bytes,
                      },
                      "runtime_probe": runtime_probe,
                  }))
                  .expect("serialize runtime capability")
              );
          }
          '@ | Set-Content -LiteralPath $example -Encoding utf8NoBOM

          function Get-CapabilitySnapshot([string] $Phase) {
            $registryPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management'
            $raw = [string[]]@((Get-ItemPropertyValue -LiteralPath $registryPath -Name PagingFiles))
            $computer = Get-CimInstance -ClassName Win32_ComputerSystem
            $settings = @(Get-CimInstance -ClassName Win32_PageFileSetting |
              Select-Object Name, InitialSize, MaximumSize)
            $usage = @(Get-CimInstance -ClassName Win32_PageFileUsage |
              Sort-Object Name |
              Select-Object Name, AllocatedBaseSize, CurrentUsage, PeakUsage, TempPageFile)
            $usageAllocatedBytes = [uint64]0
            foreach ($row in $usage) {
              $allocatedBytes = [uint64]$row.AllocatedBaseSize * [uint64]1MB
              if ($usageAllocatedBytes -gt [uint64]::MaxValue - $allocatedBytes) {
                throw 'Win32_PageFileUsage allocated size sum overflowed'
              }
              $usageAllocatedBytes += $allocatedBytes
            }
            $runtimeText = & cargo run --locked --quiet --example issue898_pagefile_capability_probe
            if ($LASTEXITCODE -ne 0) {
              throw "pagefile capability helper exited $LASTEXITCODE"
            }
            $runtime = $runtimeText | ConvertFrom-Json
            $physicalRamBytes = [uint64]$runtime.live.physical_ram_bytes
            $commitLimitBytes = [uint64]$runtime.live.commit_limit_bytes
            if ($physicalRamBytes -gt [uint64]::MaxValue - $usageAllocatedBytes) {
              throw 'RAM plus Win32_PageFileUsage allocated size overflowed'
            }
            $usageExpectedCommitLimitBytes = $physicalRamBytes + $usageAllocatedBytes
            $usageCommitLimitDeltaBytes = [int64]$commitLimitBytes -
              [int64]$usageExpectedCommitLimitBytes
            [pscustomobject]@{
              schema_version = 'ember-issue898-pagefile-capability-snapshot-v1'
              phase = $Phase
              raw_paging_files = $raw
              automatic_managed_pagefile = [bool]$computer.AutomaticManagedPagefile
              pagefile_settings = $settings
              pagefile_setting_count = $settings.Count
              pagefile_usage = $usage
              pagefile_usage_count = $usage.Count
              pagefile_usage_allocated_bytes = $usageAllocatedBytes
              pagefile_usage_expected_commit_limit_bytes = $usageExpectedCommitLimitBytes
              pagefile_usage_commit_limit_delta_bytes = $usageCommitLimitDeltaBytes
              runtime = $runtime
            }
          }

          function Get-UsageRow([object] $Snapshot, [string] $Name) {
            $rows = @($Snapshot.pagefile_usage | Where-Object { $_.Name -ieq $Name })
            if ($rows.Count -ne 1) {
              throw "expected exactly one active usage row for $Name; observed $($rows.Count)"
            }
            $rows[0]
          }

          function Get-SettingRows([object] $Snapshot, [string] $Name) {
            @($Snapshot.pagefile_settings | Where-Object { $_.Name -ieq $Name })
          }

          function Assert-PinApplied([object] $Snapshot, [string] $Name, [uint32] $ExpectedMiB) {
            $usageRow = Get-UsageRow $Snapshot $Name
            $settingRows = @(Get-SettingRows $Snapshot $Name)
            if ($settingRows.Count -ne 1) {
              throw "pin verification requires exactly one setting for $Name; observed $($settingRows.Count)"
            }
            $setting = $settingRows[0]
            if ([uint32]$setting.InitialSize -ne $ExpectedMiB -or
                [uint32]$setting.MaximumSize -ne $ExpectedMiB -or
                $ExpectedMiB -eq 0) {
              throw "pin verification did not read back fixed positive $ExpectedMiB MiB for $Name"
            }
            if ([uint32]$usageRow.AllocatedBaseSize -ne $ExpectedMiB) {
              throw "active allocation for $Name is $($usageRow.AllocatedBaseSize) MiB, expected $ExpectedMiB MiB"
            }
            if ([bool]$usageRow.TempPageFile) {
              throw "active contributor remains a temporary pagefile after pin: $Name"
            }
          }

          function Assert-UsageNames([object] $Snapshot, [string[]] $ExpectedNames) {
            $actual = [string[]]@($Snapshot.pagefile_usage | ForEach-Object {
              ([string]$_.Name).ToLowerInvariant()
            } | Sort-Object -Unique)
            $expected = [string[]]@($ExpectedNames | ForEach-Object {
              $_.ToLowerInvariant()
            } | Sort-Object -Unique)
            $difference = @(Compare-Object -ReferenceObject $expected -DifferenceObject $actual)
            if ($difference.Count -ne 0) {
              throw "active pagefile topology changed unexpectedly: $($difference | ConvertTo-Json -Compress)"
            }
          }

          function Assert-UsageNamesDuringTargetRecreate(
              [object] $Snapshot,
              [string[]] $ExpectedNames,
              [string] $TargetName) {
            $targetRows = @($Snapshot.pagefile_usage | Where-Object {
              $_.Name -ieq $TargetName
            })
            if ($targetRows.Count -gt 1) {
              throw "target recreation observed duplicate active rows for ${TargetName}: $($targetRows.Count)"
            }
            $actualNonTarget = [string[]]@($Snapshot.pagefile_usage | Where-Object {
              $_.Name -ine $TargetName
            } | ForEach-Object {
              ([string]$_.Name).ToLowerInvariant()
            } | Sort-Object -Unique)
            $expectedNonTarget = [string[]]@($ExpectedNames | Where-Object {
              $_ -ine $TargetName
            } | ForEach-Object {
              $_.ToLowerInvariant()
            } | Sort-Object -Unique)
            $difference = @(
              Compare-Object -ReferenceObject $expectedNonTarget -DifferenceObject $actualNonTarget
            )
            if ($difference.Count -ne 0) {
              throw "non-target pagefile topology changed during target recreation: $($difference | ConvertTo-Json -Compress)"
            }
          }

          function Assert-FinalPinnedTopology([object] $Snapshot) {
            $usageRows = @($Snapshot.pagefile_usage)
            $settingRows = @($Snapshot.pagefile_settings)
            if ([bool]$Snapshot.automatic_managed_pagefile) {
              throw 'final topology still has automatic pagefile management enabled'
            }
            if ($usageRows.Count -eq 0) { throw 'final active pagefile census is empty' }
            if ($usageRows.Count -ne $settingRows.Count) {
              throw "final usage/setting count mismatch: usage=$($usageRows.Count) settings=$($settingRows.Count)"
            }
            foreach ($usageRow in $usageRows) {
              $settings = @(Get-SettingRows $Snapshot ([string]$usageRow.Name))
              if ($settings.Count -ne 1) {
                throw "final active contributor lacks one setting: $($usageRow.Name)"
              }
              Assert-PinApplied $Snapshot ([string]$usageRow.Name) ([uint32]$settings[0].MaximumSize)
            }
            foreach ($setting in $settingRows) {
              [void](Get-UsageRow $Snapshot ([string]$setting.Name))
            }
            $expectedRegistry = [string[]]@($settingRows | ForEach-Object {
              ("{0} {1} {2}" -f $_.Name, $_.InitialSize, $_.MaximumSize).ToLowerInvariant()
            } | Sort-Object)
            $actualRegistry = [string[]]@($Snapshot.raw_paging_files | ForEach-Object {
              ([string]$_).Trim().ToLowerInvariant()
            } | Sort-Object)
            $registryDifference = @(
              Compare-Object -ReferenceObject $expectedRegistry -DifferenceObject $actualRegistry
            )
            if ($registryDifference.Count -ne 0) {
              throw "registry/settings fixed pagefile sets disagree: $($registryDifference | ConvertTo-Json -Compress)"
            }
          }

          $before = Get-CapabilitySnapshot 'BEFORE'
          $tempDrive = (Get-Item -LiteralPath $env:RUNNER_TEMP).PSDrive.Root.TrimEnd('\')
          $driveId = $tempDrive.TrimEnd(':') + ':'
          $logicalDisk = Get-CimInstance -ClassName Win32_LogicalDisk -Filter "DeviceID='$driveId'"
          if ($null -eq $logicalDisk) { throw "no logical disk for RUNNER_TEMP drive $driveId" }
          $reserveBytes = [uint64]4GB
          $fixedMiB = [uint32]$env:FIXED_MIB
          $fixedBytes = [uint64]$fixedMiB * [uint64]1MB
          if ([uint64]$logicalDisk.FreeSpace -lt $reserveBytes + $fixedBytes) {
            throw "RUNNER_TEMP drive cannot preserve the fixed 4 GiB reserve at $fixedMiB MiB"
          }
          $pagefileName = "$driveId\pagefile.sys"

          $mutationFault = $null
          $mutationSnapshots = @()
          try {
            $computer = Get-CimInstance -ClassName Win32_ComputerSystem
            $current = $before
            if ([bool]$computer.AutomaticManagedPagefile) {
              Set-CimInstance -InputObject $computer -Property @{
                AutomaticManagedPagefile = $false
              } | Out-Null
              $current = Get-CapabilitySnapshot 'AFTER_AUTOMATIC_MANAGEMENT_DISABLED'
              $mutationSnapshots += $current
            }
            if ($env:MUTATION_SHAPE -ne 'pin_all_fixed') {
              throw "unknown mutation shape: $env:MUTATION_SHAPE"
            }

            $initialUsage = @($current.pagefile_usage)
            if ($initialUsage.Count -eq 0) { throw 'pin-all requires at least one active pagefile' }
            $expectedNames = [string[]]@($initialUsage | ForEach-Object { [string]$_.Name })

            foreach ($usageRow in $initialUsage) {
              $name = [string]$usageRow.Name
              if ($name -ieq $pagefileName) { continue }
              $desiredMiB = [uint32]$usageRow.AllocatedBaseSize
              if ($desiredMiB -eq 0) { throw "cannot pin zero-sized active pagefile: $name" }
              $snapshotSettings = @(Get-SettingRows $current $name)
              $liveSettings = @(Get-CimInstance -ClassName Win32_PageFileSetting |
                Where-Object { $_.Name -ieq $name })
              if ($snapshotSettings.Count -ne $liveSettings.Count -or $liveSettings.Count -gt 1) {
                throw "setting census changed before pinning ${name}: snapshot=$($snapshotSettings.Count) live=$($liveSettings.Count)"
              }
              if ($liveSettings.Count -eq 1 -and
                  ([uint32]$snapshotSettings[0].InitialSize -ne [uint32]$liveSettings[0].InitialSize -or
                   [uint32]$snapshotSettings[0].MaximumSize -ne [uint32]$liveSettings[0].MaximumSize)) {
                throw "setting values changed before pinning $name"
              }
              $wrotePin = $false
              if ($liveSettings.Count -eq 0) {
                New-CimInstance -ClassName Win32_PageFileSetting -Property @{
                  Name = $name
                  InitialSize = $desiredMiB
                  MaximumSize = $desiredMiB
                } | Out-Null
                $wrotePin = $true
              } elseif ([uint32]$liveSettings[0].InitialSize -ne $desiredMiB -or
                  [uint32]$liveSettings[0].MaximumSize -ne $desiredMiB) {
                Set-CimInstance -InputObject $liveSettings[0] -Property @{
                  InitialSize = $desiredMiB
                  MaximumSize = $desiredMiB
                } | Out-Null
                $wrotePin = $true
              }
              if ($wrotePin) {
                $current = Get-CapabilitySnapshot "AFTER_PIN_$($mutationSnapshots.Count)"
                $mutationSnapshots += $current
                Assert-UsageNames $current $expectedNames
              }
              Assert-PinApplied $current $name $desiredMiB
            }

            $targetSnapshotSettings = @(Get-SettingRows $current $pagefileName)
            $targetLiveSettings = @(Get-CimInstance -ClassName Win32_PageFileSetting |
              Where-Object { $_.Name -ieq $pagefileName })
            if ($targetSnapshotSettings.Count -ne $targetLiveSettings.Count -or
                $targetLiveSettings.Count -gt 1) {
              throw "target setting census changed before pinning ${pagefileName}: snapshot=$($targetSnapshotSettings.Count) live=$($targetLiveSettings.Count)"
            }
            if ($targetLiveSettings.Count -eq 1 -and
                ([uint32]$targetSnapshotSettings[0].InitialSize -ne [uint32]$targetLiveSettings[0].InitialSize -or
                 [uint32]$targetSnapshotSettings[0].MaximumSize -ne [uint32]$targetLiveSettings[0].MaximumSize)) {
              throw "target setting values changed before pinning $pagefileName"
            }
            $createdTargetPin = $false
            $recreateTargetPin = $targetLiveSettings.Count -eq 1 -and
              ([uint32]$targetLiveSettings[0].InitialSize -ne $fixedMiB -or
               [uint32]$targetLiveSettings[0].MaximumSize -ne $fixedMiB)
            if ($recreateTargetPin) {
              Remove-CimInstance -InputObject $targetLiveSettings[0]
              $current = Get-CapabilitySnapshot 'AFTER_TARGET_DELETE'
              $mutationSnapshots += $current
              Assert-UsageNamesDuringTargetRecreate $current $expectedNames $pagefileName
              $remainingTargetSettings = @(Get-SettingRows $current $pagefileName)
              if ($remainingTargetSettings.Count -ne 0) {
                throw "target setting remained after target-only delete: $($remainingTargetSettings.Count)"
              }
              New-CimInstance -ClassName Win32_PageFileSetting -Property @{
                Name = $pagefileName
                InitialSize = $fixedMiB
                MaximumSize = $fixedMiB
              } | Out-Null
              $createdTargetPin = $true
            } elseif ($targetLiveSettings.Count -eq 0) {
              New-CimInstance -ClassName Win32_PageFileSetting -Property @{
                Name = $pagefileName
                InitialSize = $fixedMiB
                MaximumSize = $fixedMiB
              } | Out-Null
              $createdTargetPin = $true
            }
            if ($createdTargetPin) {
              $expectedNames = [string[]]@($expectedNames + $pagefileName | Sort-Object -Unique)
              $current = Get-CapabilitySnapshot 'AFTER_TARGET_CREATE'
              $mutationSnapshots += $current
              Assert-UsageNames $current $expectedNames
            }
            Assert-PinApplied $current $pagefileName $fixedMiB
            Assert-FinalPinnedTopology $current
          } catch {
            $mutationFault = $_.Exception.ToString()
          }

          $after = $null
          $snapshotFault = $null
          try {
            $after = Get-CapabilitySnapshot 'AFTER'
          } catch {
            $snapshotFault = $_.Exception.ToString()
          }
          if ($null -ne $after -and $null -eq $mutationFault) {
            try {
              Assert-UsageNames $after $expectedNames
              Assert-PinApplied $after $pagefileName $fixedMiB
              Assert-FinalPinnedTopology $after
            } catch {
              $mutationFault = "final pin verification failed: $($_.Exception.ToString())"
            }
          }
          $runtimeAccepted = $null -ne $after -and
            $after.runtime.runtime_probe.verdict -eq 'ACCEPT'
          $measurementComplete = $null -ne $after -and
            $null -eq $snapshotFault
          $result = if ($null -ne $mutationFault) {
            'REFUSED_BY_HOST'
          } elseif (-not $measurementComplete) {
            'MEASUREMENT_FAILED'
          } elseif ($runtimeAccepted) {
            'ACCEPTED'
          } else {
            'FALSE_ACCEPT'
          }
          $faultText = if ($null -ne $mutationFault) {
            $mutationFault
          } elseif ($null -ne $snapshotFault) {
            $snapshotFault
          } elseif (-not $runtimeAccepted) {
            [string]$after.runtime.runtime_probe.detail
          } else { $null }
          $rawPagingFilesAfter = $null
          $pagefileSettingsAfter = $null
          $pagefileUsageAfter = $null
          $mutationSnapshotsRecord = [object[]]@($mutationSnapshots)
          if ($null -ne $after) {
            $rawPagingFilesAfter = [string[]]@($after.raw_paging_files)
            $pagefileSettingsAfter = [object[]]@($after.pagefile_settings)
            $pagefileUsageAfter = [object[]]@($after.pagefile_usage)
          }
          $record = [ordered]@{
            schema_version = 'ember-issue898-pagefile-boundary-census-v1'
            recorded_at_ms = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
            result = $result
            fault_text = $faultText
            mutation_accepted = $null -eq $mutationFault
            measurement_obtained = $measurementComplete
            mutation_shape = $env:MUTATION_SHAPE
            requested_pagefile_mib = $fixedMiB
            requested_pagefile_bytes = $fixedBytes
            disk_reserve_bytes = $reserveBytes
            runner_temp_drive = $driveId
            mutation_snapshots = $mutationSnapshotsRecord
            raw_paging_files_before = $before.raw_paging_files
            automatic_managed_before = $before.automatic_managed_pagefile
            pagefile_settings_before = $before.pagefile_settings
            pagefile_setting_count_before = $before.pagefile_setting_count
            pagefile_usage_before = $before.pagefile_usage
            pagefile_usage_count_before = $before.pagefile_usage_count
            pagefile_usage_allocated_bytes_before = $before.pagefile_usage_allocated_bytes
            pagefile_usage_expected_commit_limit_bytes_before = $before.pagefile_usage_expected_commit_limit_bytes
            pagefile_usage_commit_limit_delta_bytes_before = $before.pagefile_usage_commit_limit_delta_bytes
            before_runtime = $before.runtime
            raw_paging_files_after = $rawPagingFilesAfter
            automatic_managed_after = if ($null -ne $after) { $after.automatic_managed_pagefile } else { $null }
            pagefile_settings_after = $pagefileSettingsAfter
            pagefile_setting_count_after = if ($null -ne $after) { $after.pagefile_setting_count } else { $null }
            pagefile_usage_after = $pagefileUsageAfter
            pagefile_usage_count_after = if ($null -ne $after) { $after.pagefile_usage_count } else { $null }
            pagefile_usage_allocated_bytes_after = if ($null -ne $after) { $after.pagefile_usage_allocated_bytes } else { $null }
            pagefile_usage_expected_commit_limit_bytes_after = if ($null -ne $after) { $after.pagefile_usage_expected_commit_limit_bytes } else { $null }
            pagefile_usage_commit_limit_delta_bytes_after = if ($null -ne $after) { $after.pagefile_usage_commit_limit_delta_bytes } else { $null }
            after_runtime = if ($null -ne $after) { $after.runtime } else { $null }
            measured_commit_limit_bytes = if ($null -ne $after) {
              [uint64]$after.runtime.live.commit_limit_bytes
            } else { $null }
            measured_commit_total_bytes = if ($null -ne $after) {
              [uint64]$after.runtime.live.commit_total_bytes
            } else { $null }
            measured_commit_remaining_bytes = if ($null -ne $after) {
              [uint64]$after.runtime.live.commit_remaining_bytes
            } else { $null }
            runtime_declared_maximum_commit_capacity_bytes = if ($runtimeAccepted) {
              [uint64]$after.runtime.runtime_probe.maximum_commit_capacity_bytes
            } else { $null }
          }
          $bytes = [System.Text.UTF8Encoding]::new($false).GetBytes(
            (($record | ConvertTo-Json -Depth 10) + "`n")
          )
          $stream = [System.IO.File]::Open($resultPath, [System.IO.FileMode]::CreateNew,
            [System.IO.FileAccess]::Write, [System.IO.FileShare]::Read)
          try {
            $stream.Write($bytes, 0, $bytes.Length)
            $stream.Flush($true)
          } finally {
            $stream.Dispose()
          }
          Write-Output ('BOUNDARY_RESULT=' + ($record | ConvertTo-Json -Compress -Depth 10))
          Remove-Item -LiteralPath $example -Force

      - name: Upload boundary census record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue898-pagefile-boundary-${{ github.run_id }}-${{ matrix.mutation_shape }}-${{ matrix.fixed_mib }}
          path: ${{ runner.temp }}/issue898-pagefile-boundary-${{ github.run_id }}-${{ matrix.mutation_shape }}-${{ matrix.fixed_mib }}
          if-no-files-found: error
          retention-days: 30
