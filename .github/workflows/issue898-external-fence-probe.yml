# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: "Issue 898: external process fence probe"

on:
  workflow_dispatch:
    inputs:
      force_setup_fault:
        description: "Claim-free durability red: force setup REFUSE before host mutation"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: issue898-external-process-fence
  cancel-in-progress: false

jobs:
  external-fence:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Run exact survival representation and verifier reds
        shell: pwsh
        working-directory: runtime/ember-lab
        run: |
          cargo test --locked -p ember-lab --lib foreign_process_provider_integration_tests::named_identity_exit_is_receipted_without_phantom_commit_attribution -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p ember-lab --lib foreign_pressure_probe_receipt_tests::exact_verifier_rejects_a_named_identity_that_did_not_survive_the_end_probe -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Declare and measure the governed host commit envelope
        shell: pwsh
        working-directory: runtime/ember-lab
        env:
          EMBER_ISSUE898_EXTERNAL_ARTIFACT: ${{ runner.temp }}\issue898-external-fence-${{ github.run_id }}
          EMBER_ISSUE898_FORCE_SETUP_FAULT: ${{ inputs.force_setup_fault }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactRoot = $env:EMBER_ISSUE898_EXTERNAL_ARTIFACT
          $setupRoot = Join-Path $artifactRoot 'setup'
          $setupLedger = Join-Path $setupRoot 'stages.jsonl'
          if (Test-Path -LiteralPath $artifactRoot) {
            throw "no-overwrite artifact root already exists: $artifactRoot"
          }
          [System.IO.Directory]::CreateDirectory($setupRoot) | Out-Null

          $example = Join-Path $PWD 'examples\issue898_host_envelope_snapshot.rs'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $example) | Out-Null
          @'
          #[cfg(not(windows))]
          compile_error!("issue898 host-envelope snapshot is Windows-only");

          use ember_lab::probe_host_commit_capacity;
          use serde_json::json;
          use windows_sys::Win32::System::ProcessStatus::{
              GetPerformanceInfo, PERFORMANCE_INFORMATION,
          };

          fn checked_bytes(pages: usize, page_size: u64, label: &str) -> u64 {
              (pages as u64)
                  .checked_mul(page_size)
                  .unwrap_or_else(|| panic!("live GetPerformanceInfo overflowed {label}"))
          }

          fn main() {
              let mut info: PERFORMANCE_INFORMATION = unsafe { std::mem::zeroed() };
              info.cb = std::mem::size_of::<PERFORMANCE_INFORMATION>() as u32;
              assert_ne!(
                  unsafe { GetPerformanceInfo(&mut info, info.cb) },
                  0,
                  "GetPerformanceInfo failed: {}",
                  std::io::Error::last_os_error()
              );
              let page_size = info.PageSize as u64;
              let physical_ram_bytes =
                  checked_bytes(info.PhysicalTotal, page_size, "physical RAM bytes");
              let commit_total_bytes =
                  checked_bytes(info.CommitTotal, page_size, "committed bytes");
              let commit_limit_bytes =
                  checked_bytes(info.CommitLimit, page_size, "commit limit bytes");
              let commit_remaining_bytes = commit_limit_bytes
                  .checked_sub(commit_total_bytes)
                  .expect("live committed bytes exceed live commit limit");
              let runtime_probe = match probe_host_commit_capacity() {
                  Ok(capacity) => json!({
                      "verdict": "ACCEPT",
                      "detail": null,
                      "physical_ram_bytes": capacity.physical_ram_bytes,
                      "pagefile_maximum_bytes": capacity.pagefile_maximum_bytes,
                      "pagefile_configuration_sha256": capacity.pagefile_configuration_sha256,
                      "commit_total_bytes": capacity.commit_total_bytes,
                      "commit_limit_bytes": capacity.current_commit_limit_bytes,
                      "commit_remaining_bytes": capacity.current_commit_remaining_bytes,
                  }),
                  Err(error) => json!({
                      "verdict": "REFUSE",
                      "detail": error.to_string(),
                  }),
              };
              println!(
                  "{}",
                  serde_json::to_string(&json!({
                      "schema_version": "ember-issue898-host-envelope-snapshot-v1",
                      "live": {
                          "physical_ram_bytes": physical_ram_bytes,
                          "commit_total_bytes": commit_total_bytes,
                          "commit_limit_bytes": commit_limit_bytes,
                          "commit_remaining_bytes": commit_remaining_bytes,
                      },
                      "runtime_probe": runtime_probe,
                  }))
                  .expect("serialize host-envelope snapshot")
              );
          }
          '@ | Set-Content -LiteralPath $example -Encoding utf8NoBOM

          function Get-HostEnvelopeSnapshot {
            $registryPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management'
            $raw = [string[]]@((Get-ItemPropertyValue -LiteralPath $registryPath -Name PagingFiles))
            $computer = Get-CimInstance -ClassName Win32_ComputerSystem
            $runtimeText = & cargo run --locked --quiet --example issue898_host_envelope_snapshot
            if ($LASTEXITCODE -ne 0) {
              throw "host-envelope snapshot helper exited $LASTEXITCODE"
            }
            [pscustomobject]@{
              raw_paging_files = $raw
              automatic_managed_pagefile = [bool]$computer.AutomaticManagedPagefile
              runtime = (($runtimeText -join '') | ConvertFrom-Json)
            }
          }

          function Get-EnvelopeDecision(
            [string] $RuntimeVerdict,
            [string] $RuntimeDetail,
            [uint64] $CommitLimitDeltaBytes,
            [uint64] $CommitLimitToleranceBytes,
            [bool] $FixtureFitsHardCap
          ) {
            if ($RuntimeVerdict -ne 'ACCEPT') {
              return [pscustomobject]@{ result = 'REFUSE'; detail = $RuntimeDetail }
            }
            if ($CommitLimitDeltaBytes -gt $CommitLimitToleranceBytes) {
              return [pscustomobject]@{
                result = 'REFUSE'
                detail = "measured commit ceiling delta $CommitLimitDeltaBytes exceeds predeclared tolerance $CommitLimitToleranceBytes"
              }
            }
            if (-not $FixtureFitsHardCap) {
              return [pscustomobject]@{
                result = 'REFUSE'
                detail = 'measured fixture allocation exceeds the probe hard cap'
              }
            }
            [pscustomobject]@{ result = 'PASS'; detail = $null }
          }

          $commitLimitToleranceBytes = [uint64]512MB
          $runtimeRefusalProof = Get-EnvelopeDecision 'REFUSE' 'synthetic exact runtime refusal' 0 $commitLimitToleranceBytes $true
          if ($runtimeRefusalProof.result -ne 'REFUSE' -or
              $runtimeRefusalProof.detail -ne 'synthetic exact runtime refusal') {
            throw 'runtime-refusal proof did not fail closed'
          }
          $deltaRefusalProof = Get-EnvelopeDecision 'ACCEPT' $null ($commitLimitToleranceBytes + 1) $commitLimitToleranceBytes $true
          if ($deltaRefusalProof.result -ne 'REFUSE') {
            throw 'ceiling-delta refusal proof did not fail closed'
          }
          $fitRefusalProof = Get-EnvelopeDecision 'ACCEPT' $null 0 $commitLimitToleranceBytes $false
          if ($fitRefusalProof.result -ne 'REFUSE') {
            throw 'fixture-hard-cap refusal proof did not fail closed'
          }

          $before = Get-HostEnvelopeSnapshot
          $tempDrive = (Get-Item -LiteralPath $env:RUNNER_TEMP).PSDrive.Root.TrimEnd('\')
          $driveId = $tempDrive.TrimEnd(':') + ':'
          $logicalDisk = Get-CimInstance -ClassName Win32_LogicalDisk -Filter "DeviceID='$driveId'"
          if ($null -eq $logicalDisk) { throw "no logical disk for RUNNER_TEMP drive $driveId" }
          $diskReserveBytes = [uint64]4GB
          $hostPagefileCapBytes = [uint64]12GB
          if ([uint64]$logicalDisk.FreeSpace -lt $diskReserveBytes + $hostPagefileCapBytes) {
            throw 'RUNNER_TEMP drive cannot preserve the ruled 4 GiB reserve with the ruled 12 GiB pagefile'
          }
          $requestedPagefileBytes = $hostPagefileCapBytes
          $requestedPagefileMiB = [uint32]($requestedPagefileBytes / 1MB)
          $pagefileName = "$driveId\pagefile.sys"

          $mutationFault = $null
          try {
            if ($env:EMBER_ISSUE898_FORCE_SETUP_FAULT -eq 'true') {
              throw 'deliberate issue898 host-envelope setup fault'
            }
            $computer = Get-CimInstance -ClassName Win32_ComputerSystem
            Set-CimInstance -InputObject $computer -Property @{ AutomaticManagedPagefile = $false } | Out-Null
            @(Get-CimInstance -ClassName Win32_PageFileSetting) |
              ForEach-Object { Remove-CimInstance -InputObject $_ }
            New-CimInstance -ClassName Win32_PageFileSetting -Property @{
              Name = $pagefileName
              InitialSize = $requestedPagefileMiB
              MaximumSize = $requestedPagefileMiB
            } | Out-Null
          } catch {
            $mutationFault = $_.Exception.ToString()
          }

          $after = $null
          $afterSnapshotFault = $null
          try {
            $after = Get-HostEnvelopeSnapshot
          } catch {
            $afterSnapshotFault = $_.Exception.ToString()
          }
          $runtime = if ($null -ne $after) { $after.runtime.runtime_probe } else { $null }
          $targetMatch = [regex]::Match(
            (Get-Content -LiteralPath 'tests\issue898_external_fence_probe.rs' -Raw),
            '(?m)^const TARGET: u64 = ([1-9][0-9]*) \* GIB;\r?$'
          )
          $hardCapMatch = [regex]::Match(
            (Get-Content -LiteralPath 'tests\issue898_external_fence_probe.rs' -Raw),
            '(?m)^const HARD_CAP: u64 = ([1-9][0-9]*) \* GIB;\r?$'
          )
          if (-not $targetMatch.Success -or -not $hardCapMatch.Success) {
            throw 'could not read TARGET and HARD_CAP from the governed probe source'
          }
          $gib = [uint64]1GB
          $targetBytes = [uint64]$targetMatch.Groups[1].Value * $gib
          $fixtureHardCapBytes = [uint64]$hardCapMatch.Groups[1].Value * $gib

          $runtimeAccepted = $null -ne $runtime -and $runtime.verdict -eq 'ACCEPT'
          $measuredPagefileMaximum = if ($runtimeAccepted) {
            [uint64]$runtime.pagefile_maximum_bytes
          } else { $null }
          $physicalRamBytes = if ($runtimeAccepted) {
            [uint64]$runtime.physical_ram_bytes
          } elseif ($null -ne $after) { [uint64]$after.runtime.live.physical_ram_bytes } else { $null }
          $commitLimitAfterBytes = if ($runtimeAccepted) {
            [uint64]$runtime.commit_limit_bytes
          } elseif ($null -ne $after) { [uint64]$after.runtime.live.commit_limit_bytes } else { $null }
          $commitRemainingAfterBytes = if ($runtimeAccepted) {
            [uint64]$runtime.commit_remaining_bytes
          } elseif ($null -ne $after) { [uint64]$after.runtime.live.commit_remaining_bytes } else { $null }
          $expectedCommitLimitBytes = if ($null -ne $measuredPagefileMaximum -and
              $null -ne $physicalRamBytes) {
            $physicalRamBytes + $measuredPagefileMaximum
          } else { $null }
          $commitLimitDeltaBytes = if ($null -ne $expectedCommitLimitBytes -and
              $null -ne $commitLimitAfterBytes) {
            [uint64][Math]::Abs([decimal]$commitLimitAfterBytes - [decimal]$expectedCommitLimitBytes)
          } else { [uint64]::MaxValue }
          $fixtureAllocationBytes = if ($null -ne $commitRemainingAfterBytes -and
              $commitRemainingAfterBytes -ge $targetBytes) {
            $commitRemainingAfterBytes - $targetBytes
          } else { [uint64]::MaxValue }
          $fixtureFitsHardCap = $fixtureAllocationBytes -le $fixtureHardCapBytes
          $decision = if ($null -ne $mutationFault) {
            [pscustomobject]@{ result = 'REFUSE'; detail = $mutationFault }
          } elseif ($null -ne $afterSnapshotFault) {
            [pscustomobject]@{ result = 'REFUSE'; detail = $afterSnapshotFault }
          } else {
            Get-EnvelopeDecision `
              ([string]$runtime.verdict) `
              ([string]$runtime.detail) `
              $commitLimitDeltaBytes `
              $commitLimitToleranceBytes `
              $fixtureFitsHardCap
          }

          $row = [ordered]@{
            schema_version = 'ember-issue898-host-envelope-setup-v1'
            recorded_at_ms = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
            stage = 'host_envelope_setup'
            result = $decision.result
            detail = $decision.detail
            raw_paging_files_before = $before.raw_paging_files
            raw_paging_files_after = if ($null -ne $after) { $after.raw_paging_files } else { $null }
            automatic_managed_before = $before.automatic_managed_pagefile
            automatic_managed_after = if ($null -ne $after) { $after.automatic_managed_pagefile } else { $null }
            requested_pagefile_bytes = $requestedPagefileBytes
            measured_pagefile_maximum = $measuredPagefileMaximum
            physical_ram_bytes = $physicalRamBytes
            commit_limit_before_bytes = [uint64]$before.runtime.live.commit_limit_bytes
            commit_limit_after_bytes = $commitLimitAfterBytes
            expected_commit_limit_bytes = $expectedCommitLimitBytes
            commit_limit_delta_bytes = $commitLimitDeltaBytes
            commit_limit_tolerance_bytes = $commitLimitToleranceBytes
            commit_remaining_after_bytes = $commitRemainingAfterBytes
            runtime_verdict = if ($null -ne $runtime) { [string]$runtime.verdict } else { 'REFUSE' }
            runtime_detail = if ($null -ne $runtime) { [string]$runtime.detail } else { $afterSnapshotFault }
            pagefile_configuration_sha256 = if ($null -ne $runtime) {
              [string]$runtime.pagefile_configuration_sha256
            } else { $null }
            mutation_fault = $mutationFault
            after_snapshot_fault = $afterSnapshotFault
            forced_fault = $env:EMBER_ISSUE898_FORCE_SETUP_FAULT -eq 'true'
            fixture_allocation_bytes = $fixtureAllocationBytes
            fixture_hard_cap_bytes = $fixtureHardCapBytes
            fixture_fits_hard_cap = $fixtureFitsHardCap
            refusal_proofs = [ordered]@{
              runtime_refusal = $runtimeRefusalProof.result
              ceiling_delta_refusal = $deltaRefusalProof.result
              fixture_hard_cap_refusal = $fitRefusalProof.result
            }
          }
          $line = ($row | ConvertTo-Json -Compress -Depth 6) + "`n"
          $encoding = [System.Text.UTF8Encoding]::new($false)
          $stream = [System.IO.File]::Open($setupLedger, [System.IO.FileMode]::CreateNew,
            [System.IO.FileAccess]::Write, [System.IO.FileShare]::Read)
          try {
            $bytes = $encoding.GetBytes($line)
            $stream.Write($bytes, 0, $bytes.Length)
            $stream.Flush($true)
          } finally {
            $stream.Dispose()
          }
          Remove-Item -LiteralPath $example -Force
          Write-Output ('HOST_ENVELOPE_SETUP=' + ($row | ConvertTo-Json -Compress -Depth 6))
          if ($decision.result -ne 'PASS') { throw $decision.detail }

      - name: Run governed external fence probe
        shell: pwsh
        working-directory: runtime/ember-lab
        env:
          EMBER_ISSUE898_EXTERNAL_OUTPUT: ${{ runner.temp }}\issue898-external-fence-${{ github.run_id }}\probe
        run: |
          if (Test-Path -LiteralPath $env:EMBER_ISSUE898_EXTERNAL_OUTPUT) {
            throw "no-overwrite output root already exists: $env:EMBER_ISSUE898_EXTERNAL_OUTPUT"
          }
          cargo test --locked -p ember-lab --test issue898_external_fence_probe issue898_external_fence_live_probe -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload immutable probe receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue898-external-fence-${{ github.run_id }}
          path: ${{ runner.temp }}/issue898-external-fence-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
