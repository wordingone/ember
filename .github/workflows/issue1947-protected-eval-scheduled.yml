# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: issue1947 protected eval scheduled verification

on:
  # Schedule DISABLED 2026-11-05. The last step verifies
  # receipts/issue1947/release-bundle-pointer.json, and no release bundle has
  # been admitted to master (the issue1947 campaign is paused), so every
  # scheduled run refused on a missing pointer and carried no signal.
  # RE-ENABLE CONDITION: a release-bundle pointer is admitted on master at
  # receipts/issue1947/release-bundle-pointer.json. Then restore:
  #   schedule:
  #     - cron: "23 10 * * *"
  # workflow_dispatch stays available for manual runs in the meantime.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family-fixtures-and-admitted-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5
        with:
          python-version: "3.10"
      - run: python -m pip install pytest
      - run: >-
          python -m pytest -p no:cacheprovider -q
          tests/ember_restart_model/domain-governance/test_issue1947_release_preflight.py
          tests/ember_restart_model/domain-governance/test_issue1947_release_execute.py
          tests/ember_restart_model/domain-governance/test_issue1947_release_recompute.py
      - name: Verify the admitted release bundle pointer
        run: >-
          python src/ember/governance/scripts/issue1947_release_recompute.py
          --repo-root .
          --pointer receipts/issue1947/release-bundle-pointer.json
          --receipt "issue1947-scheduled-recompute-${GITHUB_RUN_ID}.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: issue1947-scheduled-recompute
          path: issue1947-scheduled-recompute-*.json
          if-no-files-found: error
          retention-days: 30
