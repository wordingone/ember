name: labels-policy

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  merge_group:

permissions:
  contents: read

jobs:
  labels-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install "PyYAML==6.0.2"
      - name: Validate manifest and migration contract
        run: |
          python -B scripts/github/policy.py labels --manifest .github/labels.yml
          python -B scripts/github/policy.py migrations --manifest .github/labels.yml --migrations .github/label-migrations.yml
          python -B -m unittest scripts.github.test_labels scripts.github.test_policy -v
