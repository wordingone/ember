# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: labels-policy

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  merge_group:

permissions:
  contents: read

jobs:
  labels-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install "PyYAML==6.0.2"
      - name: Validate manifest and migration contract
        run: |
          python -B scripts/github/policy.py labels --manifest .github/labels.yml
          python -B scripts/github/policy.py migrations --manifest .github/labels.yml --migrations .github/label-migrations.yml
          python -B -m unittest src.ember.governance.scripts.github.test_labels src.ember.governance.scripts.github.test_policy -v
