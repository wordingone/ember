# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: Repository health report

on:
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Capture live control plane
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B scripts/github/snapshot.py
          --without-comments
          --output repository-snapshot.json
      - name: Build outcome-oriented advisory report
        run: >-
          python -B scripts/github/repo_health.py
          --snapshot repository-snapshot.json
          --output repository-health.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-health-${{ github.run_id }}
          path: |
            repository-snapshot.json
            repository-health.json
          retention-days: 30
