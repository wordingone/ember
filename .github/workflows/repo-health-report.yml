# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: Repository health report

on:
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Capture live control plane
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B src/ember/governance/scripts/github/snapshot.py
          --without-comments
          --output repository-snapshot.json
      - name: Build outcome-oriented advisory report
        run: >-
          python -B src/ember/governance/scripts/github/repo_health.py
          --snapshot repository-snapshot.json
          --output repository-health.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repository-health-${{ github.run_id }}
          path: |
            repository-snapshot.json
            repository-health.json
          retention-days: 30
