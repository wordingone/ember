name: remote-branch-salvage-capture
# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  deployments: read

concurrency:
  group: remote-branch-salvage-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require an exact master dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/master"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Capture complete bounded public state
        id: capture
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/remote-branch-salvage-raw"
          out="${RUNNER_TEMP}/remote-branch-salvage-artifact"
          mkdir -p "${raw}" "${out}"
          captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          api_master=$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq .sha)
          test "${api_master}" = "${GITHUB_SHA}"

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
            > "${raw}/branches_pre.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls?state=all&per_page=100" \
            > "${raw}/pulls.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/tags?per_page=100" \
            > "${raw}/tags.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > "${raw}/releases.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/deployments?per_page=100" \
            > "${raw}/deployments.json"
          gh api "repos/${GITHUB_REPOSITORY}/commits/master" \
            > "${raw}/public_master.json"

          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*'
          git fetch --force --tags origin

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
            > "${raw}/branches_post.json"

          python -B scripts/collect_remote_branch_salvage.py \
            --repo "${GITHUB_WORKSPACE}" \
            --raw-root "${raw}" \
            --captured-at "${captured_at}" \
            --output "${out}/capture.json"
          python -B scripts/remote_branch_salvage.py build \
            "${out}/capture.json" "${out}/packet.json"
          python -B scripts/remote_branch_salvage.py verify \
            "${out}/packet.json"
          python -B scripts/remote_branch_salvage.py summarize \
            "${out}/packet.json" "${out}/public-summary.json"
          python -B scripts/remote_branch_salvage.py verify-summary \
            "${out}/public-summary.json"

          final_master=$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq .sha)
          test "${final_master}" = "${GITHUB_SHA}"

          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg workflow_sha "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --argjson run_attempt "${GITHUB_RUN_ATTEMPT}" \
            '{
              schema_version: "ember-remote-branch-publication-context-v1",
              repository: $repository,
              mode: "GITHUB_ACTIONS_WORKFLOW_ARTIFACT",
              workflow_ref: "refs/heads/master",
              workflow_sha: $workflow_sha,
              run_id: $run_id,
              run_attempt: $run_attempt,
              excluded_refs: [],
              ref_mutations_performed: []
            }' > "${out}/publication-context.json"

          python -B scripts/finalize_remote_branch_salvage.py \
            --packet "${out}/packet.json" \
            --summary "${out}/public-summary.json" \
            --publication-context "${out}/publication-context.json" \
            --output "${out}/certification-receipt.json"

          cp "${raw}"/*.json "${out}/"
          (
            cd "${out}"
            sha256sum ./*.json | sort -k2 > SHA256SUMS
          )
          echo "artifact_path=${out}" >> "${GITHUB_OUTPUT}"

      - name: Upload immutable non-authorizing capture
        uses: actions/upload-artifact@v4
        with:
          name: remote-branch-salvage-${{ github.run_id }}-${{ github.sha }}
          path: ${{ steps.capture.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 90
