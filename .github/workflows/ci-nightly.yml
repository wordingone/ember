# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: ci-nightly

on:
  schedule:
    - cron: "31 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ci-nightly
  cancel-in-progress: true

jobs:
  extended-audit:
    runs-on: ubuntu-latest
    # 180, not 90: the three suites now carry their own bounds (15 + 40 + 90 = 145) and the
    # job limit has to sit above their sum plus setup, or the last suite is cancelled by the
    # job exactly as it was before this change (#2211).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      # pytest is test tooling, not a runtime dependency, so the manifest does not carry it.
      - run: python -m pip install "pytest==8.4.1"
      # CPU torch, as every other ubuntu workflow here installs it. The manifest's torch row is
      # the cu126 build from the CUDA wheel index, which this runner cannot use.
      - run: python -m pip install "torch==2.13.0" --index-url https://download.pytorch.org/whl/cpu
      # The rest of the install set is DERIVED from manifests/python-environment-v1.json, not
      # hand-picked (hand-picking is how psutil, a default Linux runtime dependency, went
      # missing). Every default-install runtime row of the linux profile is installed at its
      # manifest pin, except the rows a CPU runner cannot take, which are excluded by rule, not
      # by name: the CUDA-index row (torch, above), CUDA local builds (a "+cu" version), and the
      # rows the manifest's own installer puts outside the resolver because their metadata
      # conflicts (python_environment.py _RESOLVER_BYPASS_DISTRIBUTIONS). The manifest is loaded
      # and shape-validated by its own authority tool, so a malformed manifest fails here. The
      # constraint keeps any dependency from replacing the CPU torch wheel.
      - name: Derive the non-CUDA install set from the environment manifest
        run: |
          python -I - > "${RUNNER_TEMP}/nightly-requirements.txt" <<'PY'
          import importlib.util, sys
          from pathlib import Path
          tool = Path("src/ember/infrastructure/tools/ember-restart-3b/python_environment.py")
          spec = importlib.util.spec_from_file_location("ember_python_environment", tool)
          env = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = env
          spec.loader.exec_module(env)
          manifest = env.load_manifest(Path("manifests/python-environment-v1.json"))
          env.validate_manifest_shape(manifest)
          bypass = set(env._RESOLVER_BYPASS_DISTRIBUTIONS)
          for row in env._package_rows_for_profile(manifest, "linux"):
              if row["group"] != "runtime" or not row["install_by_default"]:
                  continue
              version = env._expected_package_version(row, "linux")
              if row["source"]["kind"] == "index":
                  reason = "CUDA wheel index"
              elif "+cu" in version:
                  reason = "CUDA local build"
              elif env._normalized_distribution(row["distribution"]) in bypass:
                  reason = "outside the resolver in the manifest's own install plan"
              else:
                  print(f"{row['distribution']}=={version}")
                  continue
              print(f"excluded {row['distribution']} {version}: {reason}", file=sys.stderr)
          PY
          cat "${RUNNER_TEMP}/nightly-requirements.txt"
          grep -qx 'psutil==.*' "${RUNNER_TEMP}/nightly-requirements.txt"
          python -c 'import torch; print("torch==" + torch.__version__.split("+")[0])' > "${RUNNER_TEMP}/nightly-constraints.txt"
      - run: python -m pip install -r "${RUNNER_TEMP}/nightly-requirements.txt" -c "${RUNNER_TEMP}/nightly-constraints.txt"
      - run: python -m pip install --editable .
      - name: Guard complete scripts/tests collection
        run: python -B src/ember/governance/scripts/check_scripts_tests_collection.py --minimum 380
      # One step per suite, each with its own bound. The single combined step could only fail
      # one way once any suite stopped advancing: the JOB hit its limit and was cancelled, so
      # no suite reported terminal counts and the quiet output never named the test that
      # stopped. Three things make a stall self-describing now:
      #   continue-on-error   every suite executes even after an earlier one fails, which is
      #                       what the old `|| status=1` bought and what the aggregate keeps;
      #   timeout-minutes     a stalled suite loses its own step, not the whole job, so the
      #                       suites after it still report;
      #   faulthandler_timeout  pytest dumps all-thread tracebacks and aborts when a single
      #                       test exceeds the bound, so a hang arrives as a NAMED test rather
      #                       than as a cancellation. Each bound sits below its step's limit,
      #                       or the step is cancelled before the dump can fire.
      # --durations=25 makes the near-misses visible before they become the next stall.
      # Still no -x and no `set -e`: a nightly exists to report everything broken in one pass
      # (#1390).
      - name: Extended CPU-safe suite scripts/tests
        id: suite-scripts-tests
        continue-on-error: true
        timeout-minutes: 15
        run: python -B -m pytest -q --import-mode=importlib -o faulthandler_timeout=600 --durations=25 scripts/tests
      - name: Extended CPU-safe suite src/ember/governance/scripts/tests
        id: suite-governance-tests
        continue-on-error: true
        timeout-minutes: 40
        run: python -B -m pytest -q --import-mode=importlib -o faulthandler_timeout=900 --durations=25 src/ember/governance/scripts/tests
      - name: Extended CPU-safe suite tests
        id: suite-tests
        continue-on-error: true
        timeout-minutes: 90
        run: python -B -m pytest -q --import-mode=importlib -o faulthandler_timeout=1200 --durations=25 tests
      - name: Aggregate suite outcomes
        id: aggregate-suites
        if: always()
        run: |
          failed=""
          for entry in "scripts/tests=${{ steps.suite-scripts-tests.outcome }}" \
                       "src/ember/governance/scripts/tests=${{ steps.suite-governance-tests.outcome }}" \
                       "tests=${{ steps.suite-tests.outcome }}"; do
            suite="${entry%%=*}"
            outcome="${entry#*=}"
            echo "${suite}: ${outcome}"
            if [ "${outcome}" != "success" ]; then
              failed="${failed} ${suite}"
            fi
          done
          if [ -n "${failed}" ]; then
            echo "suites not reporting success:${failed}"
            exit 1
          fi
      - name: Explain scheduled boundary
        if: always()
        run: echo "Nightly failure is an actionable diagnostic, not a claim that recent work is worthless."

  cli-idle-soak:
    # windows-latest, not ubuntu-latest: the harness spawns a real ember-cli process under
    # node-pty and shells out to where.exe/taskkill to resolve bun.exe and clean up the child —
    # the same Windows-only fidelity bar every #1455 soak leg measured against, and what the
    # cli job already builds/tests this tree on. Not cross-platform.
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/ember/infrastructure/tools/ember-cli/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - name: Issue #1455 idle-flat soak regression (delivered-state guard)
        run: bun test services/issue1455-idle-flat-soak.test.ts
