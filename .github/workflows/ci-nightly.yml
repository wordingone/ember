# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: ci-nightly

on:
  schedule:
    - cron: "31 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ci-nightly
  cancel-in-progress: true

jobs:
  extended-audit:
    runs-on: ubuntu-latest
    # 180, not 90: the three suites now carry their own bounds (15 + 40 + 90 = 145) and the
    # job limit has to sit above their sum plus setup, or the last suite is cancelled by the
    # job exactly as it was before this change (#2211).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest==8.4.1" "PyYAML==6.0.2" "jsonschema==4.26.0" "cryptography==49.0.0"
      - run: python -m pip install "torch==2.13.0" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install "numpy==2.2.6"
      # Collection-cure round two: both pins come from the canonical
      # manifests/python-environment-v1.json environment declaration.
      - run: python -m pip install "tokenizers==0.22.2" "huggingface_hub==1.22.0"
      - run: python -m pip install --editable .
      # If another dependency round is required, stop hand-picking packages:
      # derive the nightly's non-CUDA install set from the manifest instead.
      - name: Guard complete scripts/tests collection
        run: python -B src/ember/governance/scripts/check_scripts_tests_collection.py --minimum 380
      # One step per suite, each with its own bound. The single combined step could only fail
      # one way once any suite stopped advancing: the JOB hit its limit and was cancelled, so
      # no suite reported terminal counts and the quiet output never named the test that
      # stopped. Three things make a stall self-describing now:
      #   continue-on-error   every suite executes even after an earlier one fails, which is
      #                       what the old `|| status=1` bought and what the aggregate keeps;
      #   timeout-minutes     a stalled suite loses its own step, not the whole job, so the
      #                       suites after it still report;
      #   faulthandler_timeout  pytest dumps all-thread tracebacks and aborts when a single
      #                       test exceeds the bound, so a hang arrives as a NAMED test rather
      #                       than as a cancellation. Each bound sits below its step's limit,
      #                       or the step is cancelled before the dump can fire.
      # --durations=25 makes the near-misses visible before they become the next stall.
      # Still no -x and no `set -e`: a nightly exists to report everything broken in one pass
      # (#1390).
      - name: Extended CPU-safe suite scripts/tests
        id: suite-scripts-tests
        continue-on-error: true
        timeout-minutes: 15
        run: python -B -m pytest -q --import-mode=importlib -o faulthandler_timeout=600 --durations=25 scripts/tests
      - name: Extended CPU-safe suite src/ember/governance/scripts/tests
        id: suite-governance-tests
        continue-on-error: true
        timeout-minutes: 40
        run: python -B -m pytest -q --import-mode=importlib -o faulthandler_timeout=900 --durations=25 src/ember/governance/scripts/tests
      - name: Extended CPU-safe suite tests
        id: suite-tests
        continue-on-error: true
        timeout-minutes: 90
        run: python -B -m pytest -q --import-mode=importlib -o faulthandler_timeout=1200 --durations=25 tests
      - name: Aggregate suite outcomes
        id: aggregate-suites
        if: always()
        run: |
          failed=""
          for entry in "scripts/tests=${{ steps.suite-scripts-tests.outcome }}" \
                       "src/ember/governance/scripts/tests=${{ steps.suite-governance-tests.outcome }}" \
                       "tests=${{ steps.suite-tests.outcome }}"; do
            suite="${entry%%=*}"
            outcome="${entry#*=}"
            echo "${suite}: ${outcome}"
            if [ "${outcome}" != "success" ]; then
              failed="${failed} ${suite}"
            fi
          done
          if [ -n "${failed}" ]; then
            echo "suites not reporting success:${failed}"
            exit 1
          fi
      - name: Explain scheduled boundary
        if: always()
        run: echo "Nightly failure is an actionable diagnostic, not a claim that recent work is worthless."

  cli-idle-soak:
    # windows-latest, not ubuntu-latest: the harness spawns a real ember-cli process under
    # node-pty and shells out to where.exe/taskkill to resolve bun.exe and clean up the child —
    # the same Windows-only fidelity bar every #1455 soak leg measured against, and what the
    # cli job already builds/tests this tree on. Not cross-platform.
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/ember/infrastructure/tools/ember-cli/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - name: Issue #1455 idle-flat soak regression (delivered-state guard)
        run: bun test services/issue1455-idle-flat-soak.test.ts
