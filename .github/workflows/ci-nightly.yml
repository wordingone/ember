# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: ci-nightly

on:
  schedule:
    - cron: "31 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ci-nightly
  cancel-in-progress: true

jobs:
  extended-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest==8.4.1" "PyYAML==6.0.2" "jsonschema==4.26.0" "cryptography==49.0.0"
      - run: python -m pip install "torch==2.13.0" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install "numpy==2.2.6"
      - name: Guard complete scripts/tests collection
        run: python -B scripts/check_scripts_tests_collection.py --minimum 380
      # No -x, and no `set -e` abort between the two suites: a nightly exists to report
      # everything that is broken in one pass. Fail-fast turned each night into a
      # single-failure telescope and hid the rest until the next run (#1390).
      - name: Extended CPU-safe suites
        run: |
          status=0
          python -B -m pytest -q scripts/tests || status=1
          python -B -m pytest -q tests --ignore=tests/ember_restart_model/test_checkpoint_artifacts.py || status=1
          exit "${status}"
      - name: Explain scheduled boundary
        if: always()
        run: echo "Nightly failure is an actionable diagnostic, not a claim that recent work is worthless."

  cli-idle-soak:
    # windows-latest, not ubuntu-latest: the harness spawns a real ember-cli process under
    # node-pty and shells out to where.exe/taskkill to resolve bun.exe and clean up the child —
    # the same Windows-only fidelity bar every #1455 soak leg measured against, and what the
    # cli job already builds/tests this tree on. Not cross-platform.
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/ember-cli/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - name: Issue #1455 idle-flat soak regression (delivered-state guard)
        run: bun test services/issue1455-idle-flat-soak.test.ts
