# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: ci-nightly

on:
  schedule:
    - cron: "31 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ci-nightly
  cancel-in-progress: true

jobs:
  extended-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest==8.4.1" "PyYAML==6.0.2" "jsonschema==4.26.0" "cryptography==49.0.0"
      - name: Extended CPU-safe suites
        run: |
          python -B -m pytest -q scripts/tests -x
          python -B -m pytest -q tests -x --ignore=tests/ember_restart_model/test_checkpoint_artifacts.py
      - name: Explain scheduled boundary
        if: always()
        run: echo "Nightly failure is an actionable diagnostic, not a claim that recent work is worthless."
