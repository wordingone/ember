# goal_id: EMBER-02
# workstream_id: EMBER-02A
# next_executed_outcome: EMBER-02 first sufficiently pretrained clean-genesis 3B Ember
name: repo-policy-gate

on:
  push:
    branches: [master]
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: repo-policy-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Disable symlink materialization
        run: git config --global core.symlinks false
      - name: Checkout trusted guard kernel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: guard-kernel
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pull-request merge subject as hostile data
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: guard-subject
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout protected push subject as data
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: guard-subject
          fetch-depth: 0
          persist-credentials: false
      - name: Run base-pinned repository guard
        env:
          REPO_GUARD_NAMES: ${{ secrets.REPO_GUARD_NAMES }}
          REPO_GUARD_KERNEL_ROOT: ${{ github.workspace }}/guard-kernel
          REPO_GUARD_SUBJECT_ROOT: ${{ github.workspace }}/guard-subject
          BASE_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          kernel="${GITHUB_WORKSPACE}/guard-kernel"
          subject="${GITHUB_WORKSPACE}/guard-subject"
          chmod +x "${kernel}/tools/repo-guard.sh"
          cd "${subject}"
          git cat-file -e "${BASE_SHA}^{commit}" || {
            echo "explicit range base unavailable; refusing fallback" >&2
            exit 2
          }
          bash "${kernel}/tools/repo-guard.sh" --base "${BASE_SHA}"
      - name: Acquire and validate live PR policy with trusted kernel
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          kernel="${GITHUB_WORKSPACE}/guard-kernel"
          subject="${GITHUB_WORKSPACE}/guard-subject"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${RUNNER_TEMP}/pr.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            > "${RUNNER_TEMP}/pr-files.json"
          cd "${kernel}"
          python -m scripts.github.live_pr_policy \
            --root "${kernel}" \
            --subject-root "${subject}" \
            --pr-json "${RUNNER_TEMP}/pr.json" \
            --files-json "${RUNNER_TEMP}/pr-files.json" \
            --event-base-sha "${BASE_SHA}" \
            --event-head-sha "${HEAD_SHA}" \
            --snapshot-output "${RUNNER_TEMP}/pr-policy-snapshot.json"
          actor_login="$(
            python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["actor_login"])' \
              "${RUNNER_TEMP}/pr-policy-snapshot.json"
          )"
          if [[ "${actor_login}" != "dependabot[bot]" ]]; then
            python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["body"])' \
              "${RUNNER_TEMP}/pr-policy-snapshot.json" > "${RUNNER_TEMP}/pr_body.txt"
            cd "${subject}"
            if git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
              range_base="$(git rev-parse 'HEAD^1')"
            else
              range_base="$(git merge-base "${BASE_SHA}" HEAD)"
            fi
            python "${kernel}/scripts/check_pr_authority_binding.py" \
              --root "${subject}" \
              --body-file "${RUNNER_TEMP}/pr_body.txt" \
              --changed-range "${range_base}...HEAD"
          else
            echo "trusted narrow Dependabot schema accepted; human authority binding is not applicable"
          fi